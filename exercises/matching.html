<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Match Quest - Matching Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:'Fredoka',sans-serif;color:#3a2a1f;
  background:
    radial-gradient(ellipse 75% 45% at 92% -8%, rgba(255,180,90,0.5), transparent 55%),
    radial-gradient(ellipse 60% 40% at 8% 5%, rgba(255,140,150,0.25), transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 105%, rgba(110,210,130,0.2), transparent 55%),
    linear-gradient(180deg, #ffb39a 0%, #ffc9a0 22%, #ffe2b8 48%, #fff0d6 72%, #eaf8d8 100%);
  display:flex;flex-direction:column;
}

/* HUD */
.hud{position:relative;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 18px;background:rgba(255,247,239,0.88);backdrop-filter:blur(14px);
  border-bottom:2px solid rgba(240,122,46,0.22);box-shadow:0 2px 14px rgba(90,50,20,0.08)}
.hud .side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud-chip{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;color:#3a2a1f}
.hud-back{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);color:#3a2a1f;padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:800;font-size:13px;text-decoration:none}
.hud-back:hover{border-color:#f07a2e;color:#f07a2e;background:#fff}
.sound-toggle{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);color:#3a2a1f;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}

.hc{display:none}.hb{display:none}.hsd{display:none}
.hts{display:flex;gap:3px}.ht{font-size:15px;transition:transform .3s}.ht.lost{filter:grayscale(1) opacity(.3);transform:scale(.7)}

/* TITLE */
.question-bar{position:relative;z-index:10;width:100%;text-align:center;padding:16px 80px;
  background:rgba(255,247,239,0.88);backdrop-filter:blur(12px);border-bottom:2px solid rgba(240,122,46,0.22)}
.question-badge{display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff9f5a,#f07a2e);color:#fff;
  padding:6px 18px;border-radius:999px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;letter-spacing:.5px;margin-bottom:8px;
  box-shadow:0 3px 0 rgba(240,122,46,.28)}

/* GAME AREA */
.game{flex:1;z-index:20;display:flex;align-items:stretch;padding:4px;gap:0;overflow:hidden}

/* LEFT - ITEMS */
.left-col{display:flex;flex-direction:column;gap:5px;justify-content:flex-start;padding-top:4px;
  width:clamp(130px,20vw,190px);flex-shrink:0;z-index:30;padding-left:4px}
.left-label{display:none}
.item-card{background:linear-gradient(145deg,#faf5e8,#e8dcc0);border:3px solid #a08030;border-radius:10px;
  padding:6px;cursor:pointer;user-select:none;transition:all .25s;
  min-height:70px;
  box-shadow:0 3px 7px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.6);text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.item-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.25);border-color:#d4a030}
.item-card.selected{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.5),0 3px 7px rgba(0,0,0,.25);transform:scale(1.03)}
.item-card.matched{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;border-color:#27ae60;pointer-events:none}
.item-card.wrong{animation:itemShake .5s ease;border-color:#e74c3c}
@keyframes itemShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.item-card img{width:clamp(45px,6vw,65px);height:clamp(45px,6vw,65px);object-fit:contain;margin:0 auto 2px;display:block;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.item-card .ic-label{font-size:clamp(11px,1.3vw,15px);font-weight:700;color:#3e1f0a}

/* CENTER - BRIDGE & WATER */
.center-col{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* WATER - Narrower, not full width */
.water-area{position:absolute;bottom:0;left:8%;right:8%;height:35%;z-index:2;
  background:linear-gradient(180deg,#9ad8f5 0%,#7ec8ef 22%,#5eb8e8 50%,#4aa8de 78%,#3a98d0 100%);
  overflow:hidden;border-radius:8px 8px 0 0}
.water-surface{position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 50%,transparent);
  animation:surf 2s ease-in-out infinite}
@keyframes surf{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.water-ripple{position:absolute;top:10px;left:0;right:0;height:20px;
  background:repeating-linear-gradient(90deg,transparent 0px,rgba(255,255,255,.06) 20px,transparent 40px);
  animation:ripple 3s linear infinite}
@keyframes ripple{from{transform:translateX(-40px)}to{transform:translateX(0)}}

/* CROCODILES - Constrained within water */
.croc{position:absolute;z-index:3}
.croc img{width:clamp(45px,7vw,70px);height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.croc1{bottom:30%;animation:crocL 12s linear infinite}
.croc2{bottom:10%;animation:crocR 14s linear infinite 4s}
.croc3{bottom:55%;left:40%;animation:crocBob 3s ease-in-out infinite}
@keyframes crocL{0%{left:5%}50%{left:75%}50.1%{left:75%;transform:scaleX(-1)}100%{left:5%;transform:scaleX(-1)}}
@keyframes crocR{0%{right:5%;transform:scaleX(-1)}50%{right:75%;transform:scaleX(-1)}50.1%{right:75%;transform:scaleX(1)}100%{right:5%;transform:scaleX(1)}}
@keyframes crocBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.eyes{position:absolute;z-index:4;animation:eyesPop 3s ease-in-out infinite}
.eyes svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.e1{bottom:60%;left:20%;animation-delay:0s}
.e2{bottom:30%;left:50%;animation-delay:1.2s}
.e3{bottom:50%;right:15%;animation-delay:0.6s}
@keyframes eyesPop{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-4px);opacity:1}}

/* CLIFFS */
.cliff{position:absolute;z-index:6;bottom:35%}
.cliff-left{left:0;width:10%;height:20%;
  background:linear-gradient(135deg,#8a8a7a 0%,#6a6a5a 40%,#5a5a4a 70%,#4a4a3a 100%);
  border-radius:0 8px 5px 0;box-shadow:inset -3px 0 8px rgba(0,0,0,.15)}
.cliff-left::after{content:"";position:absolute;bottom:-3px;left:0;right:0;height:5px;
  background:linear-gradient(180deg,#4a8c3a,#3a7a2a);border-radius:0 3px 0 0}
.cliff-right{right:0;width:10%;height:20%;
  background:linear-gradient(225deg,#8a8a7a 0%,#6a6a5a 40%,#5a5a4a 70%,#4a4a3a 100%);
  border-radius:8px 0 0 5px;box-shadow:inset 3px 0 8px rgba(0,0,0,.15)}
.cliff-right::after{content:"";position:absolute;bottom:-3px;left:0;right:0;height:5px;
  background:linear-gradient(180deg,#4a8c3a,#3a7a2a);border-radius:3px 0 0 0}

/* BRIDGE AREA - Higher up */
.bridge-zone{position:absolute;bottom:42%;left:10%;right:10%;height:15%;z-index:10;display:flex;align-items:flex-end;justify-content:center}

/* BRIDGE PLANKS - build one by one */
.bridge-track{position:relative;width:100%;height:100%;display:flex;align-items:flex-end}
.plank-slot{flex:1;height:100%;position:relative;display:flex;align-items:flex-end;justify-content:center}
.plank{width:90%;height:0;opacity:0;transition:height .6s cubic-bezier(.25,1.2,.5,1),opacity .4s ease;
  position:relative;border-radius:4px;transform-origin:bottom}
.plank.built{height:100%;opacity:1}
.plank-svg{width:100%;height:100%}

/* CHARACTER - Stands ON the bridge planks */
.char-on-bridge{position:absolute;z-index:15;
  transition:left 1.2s cubic-bezier(.25,1.2,.5,1);
  display:flex;flex-direction:column;align-items:center;
  bottom:56%}
.char-on-bridge img{width:clamp(50px,7vw,80px);height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));display:block;vertical-align:bottom}
.char-on-bridge.walking{animation:charBounce .6s ease-in-out}
@keyframes charBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* RIGHT - DESCRIPTIONS */
.right-col{display:flex;flex-direction:column;gap:5px;justify-content:center;padding-top:0;
  width:clamp(180px,28vw,280px);flex-shrink:0;z-index:25;padding-right:4px}
.desc-card{background:linear-gradient(145deg,#faf5e8,#e8dcc0);border:3px solid #a08030;border-radius:10px;padding:12px 14px;position:relative;
  min-height:70px;
  box-shadow:0 3px 7px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;transition:all .25s}
.desc-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.3);border-color:#d4a030}
.desc-card.selected{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.5),0 3px 7px rgba(0,0,0,.25);transform:scale(1.03)}
.desc-card.matched{opacity:.3;cursor:not-allowed;border-color:#27ae60;pointer-events:none}
.desc-card.wrong{animation:descShake .5s ease;border-color:#e74c3c}
@keyframes descShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.desc-card .dc-text{color:#3e1f0a;font-size:clamp(13px,1.6vw,18px);font-weight:600;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.desc-card .dc-nail{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#c0a040,#8B6914);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* FEEDBACK */
.fb{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.3s}
.fb.show{opacity:1;visibility:visible}
.fb-c{min-width:250px;padding:20px;text-align:center;border-radius:18px;background:#fff;
  box-shadow:0 20px 50px rgba(0,0,0,.35);transform:scale(.5);transition:.35s}
.fb.show .fb-c{transform:scale(1)}
.fb-e{font-size:55px;line-height:1}.fb-t{margin:5px 0 3px;font-size:22px;font-weight:700}
.fb-x{color:#666;font-size:13px;font-weight:600}
.fb.fn .fb-c{border:4px solid #ffd700}.fb.fn .fb-e{font-size:65px;animation:fE .6s ease-in-out infinite alternate}
.fb.fn .fb-t{font-size:26px;color:#3e1f0a}
@keyframes fE{from{transform:scale(1)}to{transform:scale(1.1) rotate(3deg)}}

.pa{display:none;margin-top:8px;min-width:130px;padding:8px 16px;border:0;border-radius:8px;
  background:linear-gradient(145deg,#e74c3c,#c0392b);color:#fff;font-family:'Fredoka',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #96281b;transition:transform .15s}
.pa:hover{transform:translateY(-2px)}

.cft{position:fixed;z-index:300;top:-14px;width:8px;height:13px;border-radius:2px;animation:cF 1.6s linear forwards}
@keyframes cF{to{transform:translate(var(--x),100vh) rotate(720deg);opacity:0}}

.banners{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:150;font-family:Fredoka,sans-serif;
  font-weight:700;padding:5px 18px;border-radius:999px;color:#fff;font-size:13px;opacity:0;pointer-events:none;
  transition:.35s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}

@media(max-width:768px){
  .game{padding:4px}
  .hud{padding:8px 12px}
  .hud-chip{padding:5px 10px;font-size:13px;font-weight:800}
  .hud-back{padding:5px 12px;font-size:11px}
  .sound-toggle{width:30px;height:30px;font-size:13px}
  .question-bar{padding:12px 20px}
  .left-col{width:clamp(75px,18vw,100px)}
  .right-col{width:clamp(85px,20vw,120px)}
  .desc-card .dc-text{font-size:10px}
  .desc-card{min-height:50px;padding:8px 10px}
  .item-card{min-height:50px}
  .char-on-bridge img{width:28px}
}
@media(max-width:480px){
  .left-col{width:65px}.right-col{width:75px}
  .item-card img{width:28px;height:28px}
  .desc-card .dc-text{font-size:8px}
  .desc-card{min-height:40px;padding:6px 8px}
  .char-on-bridge{display:none}
}
</style>
</head>
<body>

<div class="hud">
  <div class="side"><a class="hud-back" href="../EVS_Index.html">← Menu</a></div>
  <div class="side">
    <div class="hud-chip">⭐ <span id="sD">0</span></div>
    <div class="hud-chip">🔥 <span id="cD">x0</span></div>
    <div class="hud-chip" id="qCountDisplay">Q 1/5</div>
  </div>
  <div class="side"><button class="sound-toggle" id="soundToggle">🔊</button></div>
</div>

<div class="question-bar">
  <div class="question-badge">🔗 Matching Game</div>
</div>

<div class="game" id="gameEl">
  <div class="left-col" id="leftCol">
  </div>
  <div class="center-col" id="centerCol"></div>
  <div class="right-col" id="rightCol"></div>
</div>

<div class="fb" id="fb"><div class="fb-c">
  <div class="fb-e" id="fE"></div>
  <h2 class="fb-t" id="fT"></h2>
  <p class="fb-x" id="fX"></p>
  <button class="pa" id="pA" style="display:none">🔄 Play Again</button>
</div></div>

<script>
var pairs=[
  {id:"head",img:"../assets/images/face.png",label:"Head",desc:"It has eyes, nose, mouth and ears.",hint:"Think about what is on top of your body."},
  {id:"trunk",img:"../assets/images/trunk.png",label:"Trunk",desc:"It is the part of our body other than the head and the limbs.",hint:"The middle part of your body."},
  {id:"hands",img:"../assets/images/hands.png",label:"Hands",desc:"These are part of our arms.",hint:"You use these to hold things."},
  {id:"legs",img:"../assets/images/legs.png",label:"Legs",desc:"They help us to stand, walk, jump, run, etc.",hint:"You use these to move around."}
];

var score=0,combo=0,hearts=3,matched=0,sndOn=true;
var sD=document.getElementById("sD"),cD=document.getElementById("cD"),qD=document.getElementById("qCountDisplay");
var hC=document.getElementById("hC"),fb=document.getElementById("fb");

var pA=document.getElementById("pA"),sndB=document.getElementById("soundToggle");
var leftCol=document.getElementById("leftCol"),centerCol=document.getElementById("centerCol"),rightCol=document.getElementById("rightCol");
var hintPop=document.getElementById("hintPop"),instrEl=document.getElementById("instrEl");
var selectedItem=null;

var actx=null;
function eA(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}if(actx&&actx.state==='suspended')actx.resume()}
function tn(f,s,d,t,p){if(!actx||!sndOn)return;t=t||'sine';p=p||.12;var o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,actx.currentTime+s);g.gain.setValueAtTime(0,actx.currentTime+s);g.gain.linearRampToValueAtTime(p,actx.currentTime+s+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+s+d);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+s);o.stop(actx.currentTime+s+d+.03)}
function pC(){tn(523,0,.1);tn(659,.08,.12);tn(784,.16,.15)}
function pW(){tn(250,0,.12,'sawtooth',.08);tn(180,.08,.15,'sawtooth',.06)}
function pB(){tn(660,0,.08,'triangle',.1);tn(880,.06,.1,'triangle',.1)}
function pF(){[392,523,659,784,1047].forEach(function(f,i){tn(f,i*.1,.18,'triangle',.12)})}
function spk(t){if(!sndOn||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}

function conf(n){var cs=['#ff4d6d','#ffd43b','#31c76a','#4da3ff','#a85ee8','#ff8c42'];for(var i=0;i<n;i++){var p=document.createElement("div");p.className="cft";p.style.left=Math.random()*100+"vw";p.style.background=cs[Math.floor(Math.random()*cs.length)];p.style.setProperty("--x",(Math.random()*400-200)+"px");p.style.animationDelay=Math.random()*.25+"s";document.body.appendChild(p);setTimeout(function(el){return function(){el.remove()}}(p),2000)}}
function shuf(a){var c=a.slice();for(var i=c.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=c[i];c[i]=c[j];c[j]=t}return c}

function crocSVG(){
  return '<img src="../assets/images/crocodile-removebg-preview.png" alt="Crocodile">';
}

function eyesSVG(){
  return '<svg width="24" height="8" viewBox="0 0 24 8" xmlns="http://www.w3.org/2000/svg">'+
    '<circle cx="6" cy="4" r="4" fill="#2d5a1e" stroke="#1a3a10" stroke-width="0.8"/>'+
    '<circle cx="6" cy="2.5" r="2" fill="#fff"/><circle cx="6" cy="2.5" r="1" fill="#111"/>'+
    '<circle cx="18" cy="4" r="4" fill="#2d5a1e" stroke="#1a3a10" stroke-width="0.8"/>'+
    '<circle cx="18" cy="2.5" r="2" fill="#fff"/><circle cx="18" cy="2.5" r="1" fill="#111"/>'+
    '</svg>';
}

function plankSVG(){
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="plank-svg">'+
    '<defs>'+
    '<linearGradient id="pG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C08040"/><stop offset="100%" stop-color="#8B5A2B"/></linearGradient>'+
    '<linearGradient id="rG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8B6914"/><stop offset="100%" stop-color="#654321"/></linearGradient>'+
    '</defs>'+
    '<rect x="2" y="4" width="96" height="16" rx="3" fill="url(#pG)" stroke="#5a3a1a" stroke-width="1.5"/>'+
    '<line x1="10" y1="12" x2="90" y2="12" stroke="#5a3a1a" stroke-width="0.8" opacity="0.3"/>'+
    '<line x1="10" y1="8" x2="90" y2="8" stroke="#C08040" stroke-width="0.5" opacity="0.5"/>'+
    '<line x1="20" y1="20" x2="20" y2="95" stroke="url(#rG)" stroke-width="2" opacity="0.8"/>'+
    '<line x1="80" y1="20" x2="80" y2="95" stroke="url(#rG)" stroke-width="2" opacity="0.8"/>'+
    '<line x1="18" y1="35" x2="82" y2="35" stroke="#8B6914" stroke-width="1.5" opacity="0.5"/>'+
    '<line x1="18" y1="55" x2="82" y2="55" stroke="#8B6914" stroke-width="1.5" opacity="0.4"/>'+
    '<line x1="18" y1="75" x2="82" y2="75" stroke="#8B6914" stroke-width="1.5" opacity="0.3"/>'+
    '<rect x="16" y="30" width="8" height="6" rx="2" fill="#8B6914" opacity="0.6"/>'+
    '<rect x="76" y="30" width="8" height="6" rx="2" fill="#8B6914" opacity="0.6"/>'+
    '<rect x="16" y="50" width="8" height="6" rx="2" fill="#8B6914" opacity="0.5"/>'+
    '<rect x="76" y="50" width="8" height="6" rx="2" fill="#8B6914" opacity="0.5"/>'+
    '<rect x="16" y="70" width="8" height="6" rx="2" fill="#8B6914" opacity="0.4"/>'+
    '<rect x="76" y="70" width="8" height="6" rx="2" fill="#8B6914" opacity="0.4"/>'+
    '</svg>';
}

function buildCenter(){
  centerCol.innerHTML='';

  var water=document.createElement("div");water.className="water-area";
  var surf=document.createElement("div");surf.className="water-surface";water.appendChild(surf);
  var rip=document.createElement("div");rip.className="water-ripple";water.appendChild(rip);

  var c1=document.createElement("div");c1.className="croc croc1";c1.innerHTML=crocSVG();water.appendChild(c1);
  var c2=document.createElement("div");c2.className="croc croc2";c2.innerHTML=crocSVG();water.appendChild(c2);
  var c3=document.createElement("div");c3.className="croc croc3";c3.innerHTML=crocSVG();water.appendChild(c3);
  var e1=document.createElement("div");e1.className="eyes e1";e1.innerHTML=eyesSVG();water.appendChild(e1);
  var e2=document.createElement("div");e2.className="eyes e2";e2.innerHTML=eyesSVG();water.appendChild(e2);
  var e3=document.createElement("div");e3.className="eyes e3";e3.innerHTML=eyesSVG();water.appendChild(e3);
  centerCol.appendChild(water);

  var cl=document.createElement("div");cl.className="cliff cliff-left";centerCol.appendChild(cl);
  var cr=document.createElement("div");cr.className="cliff cliff-right";centerCol.appendChild(cr);

  var bz=document.createElement("div");bz.className="bridge-zone";bz.id="bridgeZone";
  var track=document.createElement("div");track.className="bridge-track";track.id="bridgeTrack";

  for(var i=0;i<pairs.length;i++){
    var slot=document.createElement("div");slot.className="plank-slot";
    var plank=document.createElement("div");plank.className="plank";plank.id="plank-"+i;
    plank.innerHTML=plankSVG();
    slot.appendChild(plank);
    track.appendChild(slot);
  }
  bz.appendChild(track);
  centerCol.appendChild(bz);

  var ch=document.createElement("div");ch.className="char-on-bridge";ch.id="charEl";
  ch.innerHTML='<img src="../assets/images/ladki.png" alt="Girl">';
  ch.style.position="absolute";
  ch.style.bottom="56%";
  ch.style.left="-2%";
  ch.style.zIndex="15";
  centerCol.appendChild(ch);
}

function buildPlank(idx){
  var plank=document.getElementById("plank-"+idx);
  if(plank)plank.classList.add("built");
}

function moveChar(){
  var charEl=document.getElementById("charEl");
  if(!charEl)return;
  var startLeft=-2;
  var endLeft=85;
  var range=endLeft-startLeft;
  var leftPos=startLeft+(matched/pairs.length)*range;
  charEl.classList.add("walking");
  setTimeout(function(){charEl.classList.remove("walking")},600);
  charEl.style.left=leftPos+"%";
}

function buildGame(){
  leftCol.innerHTML="";
  rightCol.innerHTML="";
  matched=0;selectedItem=null;
  qD.textContent="0/"+pairs.length;

  buildCenter();

  var itemOrder=shuf(pairs);
  itemOrder.forEach(function(p){
    var card=document.createElement("div");card.className="item-card";card.id="ic-"+p.id;card.dataset.id=p.id;
    card.innerHTML='<img src="'+p.img+'" alt="'+p.label+'"><div class="ic-label">'+p.label+'</div>';
    card.addEventListener("click",function(){selectItem(p.id)});
    leftCol.appendChild(card);
  });

  var descOrder=shuf(pairs);
  descOrder.forEach(function(p){
    var card=document.createElement("div");card.className="desc-card";card.id="dc-"+p.id;card.dataset.id=p.id;
    card.innerHTML='<div class="dc-nail"></div><div class="dc-text">'+p.desc+'</div>';
    card.addEventListener("click",function(){selectDesc(p.id)});
    rightCol.appendChild(card);
  });

  sD.textContent=score;cD.textContent="x"+combo;
}

function clearSelection(){
  selectedItem=null;
  document.querySelectorAll(".item-card").forEach(function(c){c.classList.remove("selected")});
  document.querySelectorAll(".desc-card").forEach(function(c){c.classList.remove("selected")});
  if(instrEl){instrEl.textContent="👆 Tap an item on the LEFT, then tap its matching description on the RIGHT!";instrEl.style.background="linear-gradient(145deg,#8B4513,#654321)";instrEl.style.borderColor="#a07820";}
}

function selectItem(id){
  eA();
  var card=document.getElementById("ic-"+id);
  if(!card||card.classList.contains("matched"))return;
  clearSelection();
  card.classList.add("selected");
  selectedItem=id;
  var p=pairs.find(function(x){return x.id===id});
  if(instrEl){instrEl.textContent="Now tap the matching description for: "+p.label+" 👉";instrEl.style.background="linear-gradient(145deg,#6a3080,#4a2060)";instrEl.style.borderColor="#a060c0";}
}

function selectDesc(id){
  eA();
  if(!selectedItem)return;
  var descCard=document.getElementById("dc-"+id);
  if(!descCard||descCard.classList.contains("matched"))return;
  checkMatch(selectedItem,id);
}

function checkMatch(itemId,descId){
  eA();
  var itemCard=document.getElementById("ic-"+itemId);
  var descCard=document.getElementById("dc-"+descId);

  if(itemId===descId){
    var p=pairs.find(function(x){return x.id===itemId});
    if(itemCard)itemCard.classList.add("matched");
    if(descCard){descCard.classList.add("matched");
      descCard.innerHTML='<div class="dc-nail"></div><div class="dc-text" style="color:#1e8449">'+p.label+': '+p.desc+'</div>';
    }
    matched++;score+=15+combo*3;combo++;
    sD.textContent=score;cD.textContent="x"+combo;
    qD.textContent=matched+"/"+pairs.length;

    buildPlank(matched-1);
    setTimeout(moveChar,700);

    pC();conf(15);
    if(combo>=2){pB();showBn("COMBO x"+combo+"!")}
    if(instrEl){instrEl.textContent="✅ "+p.label+" matched! Bridge built, now crossing!";instrEl.style.background="linear-gradient(145deg,#27ae60,#1e8449)";instrEl.style.borderColor="#196f3d";}
    selectedItem=null;
    setTimeout(clearSelection,1500);

    if(matched===pairs.length){
      setTimeout(showFin,1500);
    }
  }else{
    combo=0;cD.textContent="x0";loseH();
    pW();
    if(itemCard)itemCard.classList.add("wrong");
    if(descCard)descCard.classList.add("wrong");
    if(instrEl){instrEl.textContent="❌ Wrong! The crocodiles are hungry... Try again!";instrEl.style.background="linear-gradient(145deg,#c0392b,#922b21)";instrEl.style.borderColor="#7b241c";}
    setTimeout(function(){
      if(itemCard)itemCard.classList.remove("wrong");
      if(descCard)descCard.classList.remove("wrong");
      clearSelection();
    },600);
  }
}

function showBn(t){
  var el=document.getElementById("flB");
  if(!el){el=document.createElement("div");el.id="flB";el.className="banners";
    el.style.cssText="position:fixed;top:48px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:150;font-family:Fredoka,sans-serif;font-weight:700;padding:5px 18px;border-radius:999px;background:linear-gradient(135deg,#ff9f5a,#ff7aa8);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.35s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)";
    document.body.appendChild(el)}
  el.textContent=t;el.style.opacity="0";
  requestAnimationFrame(function(){el.style.opacity="1";el.style.transform="translateX(-50%) translateY(0)"});
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity="0";el.style.transform="translateX(-50%) translateY(-10px)"},1200);
}

function sFB(tp,e,t,x){fb.className="fb "+tp;fE.textContent=e;fT.textContent=t;fX.textContent=x||"";pA.style.display="none";fb.classList.add("show");if(tp!=="fn")setTimeout(function(){fb.classList.remove("show")},900)}

function loseH(){
  /* Unlimited tries — no game over lockout */
}

function showFin(){
  var em,ti;
  if(matched===pairs.length){em="🌟";ti="BRIDGE COMPLETE!";pF();spk("You crossed the crocodile river!")}
  else if(matched>=3){em="🏆";ti="Great Job!";spk("Great job!")}
  else{em="💪";ti="Keep Trying!";spk("Keep trying")}
  setTimeout(function(){sFB("fn",em,ti,"Score: "+score+" | Matched: "+matched+"/"+pairs.length);
    pA.style.display="inline-block";conf(50);setTimeout(function(){conf(30)},300)},500);
}

function toggleHint(){
  if(!hintPop)return;
  eA();
  var unmatched=pairs.filter(function(p){var z=document.getElementById("ic-"+p.id);return z&&!z.classList.contains("matched")});
  if(unmatched.length>0){hintPop.innerHTML="<strong>💡 Hint:</strong><br>"+unmatched[0].hint;hintPop.classList.toggle("show")}
}

pA.addEventListener("click",function(){
  fb.classList.remove("show","ok","no","fn");
  score=0;combo=0;hearts=3;
  sD.textContent="0";cD.textContent="x0";
  if(hC)hC.querySelectorAll(".ht").forEach(function(h){h.classList.remove("lost")});
  if(hintPop)hintPop.classList.remove("show");
  setTimeout(buildGame,350);
});

sndB.addEventListener("click",function(){sndOn=!sndOn;sndB.textContent=sndOn?"🔊":"🔇";if(!sndOn&&"speechSynthesis" in window)speechSynthesis.cancel()});

buildGame();
</script>
</body>
</html>
