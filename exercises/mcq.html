<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Learning Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --peach:#ff9f5a; --peach-deep:#f07a2e; --pink:#ff7aa8; --mint:#4ecb71;
  --gold:#f5c542; --ink:#3a2a1f; --ink-soft:#6a5240; --ink-dim:#8a7260;
  --cream:#fff7ef; --panel:rgba(255,255,255,0.88); --edge:rgba(240,122,46,0.22);
  --success:#2e9e4a; --error:#e05a5a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; overflow:hidden; touch-action:manipulation;}
body{
  font-family:'Nunito',sans-serif; color:var(--ink);
  background:
    radial-gradient(ellipse 75% 45% at 92% -8%, rgba(255,180,90,0.5), transparent 55%),
    radial-gradient(ellipse 60% 40% at 8% 5%, rgba(255,140,150,0.25), transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 105%, rgba(110,210,130,0.2), transparent 55%),
    linear-gradient(180deg, #ffb39a 0%, #ffc9a0 22%, #ffe2b8 48%, #fff0d6 72%, #eaf8d8 100%);
  display:flex; flex-direction:column;
}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif;}
canvas#leaves{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0;}
canvas#fxCanvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;}

.hud{position:relative; z-index:80; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  padding:10px 18px; background:rgba(255,247,239,0.88); backdrop-filter:blur(14px);
  border-bottom:2px solid var(--edge); box-shadow:0 2px 14px rgba(90,50,20,0.08);}
.hud .side{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.hud-chip{ background:var(--panel); border:2px solid var(--edge); border-radius:999px; padding:7px 14px; font-weight:800; font-size:13px; display:flex; align-items:center; gap:6px; color:var(--ink);}
.hud-back{ background:var(--panel); border:2px solid var(--edge); color:var(--ink); padding:7px 15px; border-radius:999px; cursor:pointer; font-weight:800; font-size:13px; text-decoration:none;}
.hud-back:hover{ border-color:var(--peach-deep); color:var(--peach-deep); background:#fff;}
.sound-toggle{ background:var(--panel); border:2px solid var(--edge); color:var(--ink); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;}

.question-bar{
  position:relative; z-index:10; width:100%; text-align:center;
  padding:16px 80px;
  background:rgba(255,247,239,0.88);
  backdrop-filter:blur(12px); border-bottom:2px solid var(--edge);
}
.question-badge{
  display:inline-flex; align-items:center; gap:6px;
  background:linear-gradient(135deg, var(--peach), var(--peach-deep)); color:#fff;
  padding:6px 18px; border-radius:999px;
  font-family:'Fredoka',sans-serif; font-weight:500; font-size:15px; letter-spacing:.5px; margin-bottom:8px;
  box-shadow:0 3px 0 rgba(240,122,46,.28);
}
.question-text{
  font-family:'Fredoka',sans-serif; font-size:clamp(22px,3.5vw,32px); font-weight:500; line-height:1.3; color:var(--ink);
}

.stage-wrap{
  flex:1; position:relative; overflow:hidden;
  margin:12px 48px 18px;
  border-radius:24px;
  border:3px solid rgba(255,255,255,0.85);
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%, rgba(255,255,255,0.45), transparent 70%),
    linear-gradient(180deg, rgba(255,232,200,0.55) 0%, rgba(220,245,200,0.55) 100%);
  box-shadow:0 10px 28px rgba(90,50,20,0.12), inset 0 0 40px rgba(255,255,255,0.25);
}
#gameCanvas{
  display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; position:relative; z-index:1;
}

.stage-hint{
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  font-size:12px; color:var(--ink-dim); font-weight:800; letter-spacing:.5px;
  animation:pulse 2s ease-in-out infinite; z-index:5; pointer-events:none;
  background:rgba(255,255,255,0.7); padding:5px 14px; border-radius:999px;
}
@keyframes pulse{ 0%,100%{opacity:.45;} 50%{opacity:1;} }

.feedback-overlay{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.5);
  z-index:9999; font-family:'Fredoka',sans-serif; font-weight:700;
  width:min(340px,85%); padding:0; border-radius:24px;
  opacity:0; pointer-events:none; transition:all .4s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden; text-align:center;
}
.feedback-overlay.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

.feedback-overlay .fb-character{width:90px;height:90px;margin:-10px auto 0;position:relative;z-index:2}
.feedback-overlay .fb-character img{width:100%;height:100%;object-fit:contain}

.feedback-overlay .fb-body{
  padding:8px 20px 20px; position:relative;
}
.feedback-overlay .fb-title{
  font-size:clamp(28px,5vw,36px); font-weight:700; line-height:1.1; margin-bottom:4px;
}
.feedback-overlay .fb-subtitle{
  font-size:clamp(13px,1.8vw,16px); font-weight:600; line-height:1.3; opacity:.85;
}

.feedback-overlay.correct{
  background:linear-gradient(180deg, #34d058 0%, #28a745 100%);
  color:#fff; box-shadow:0 12px 40px rgba(46,158,74,.4);
}
.feedback-overlay.correct .fb-title{ color:#fff; }
.feedback-overlay.correct .fb-subtitle{ color:rgba(255,255,255,.9); }

.feedback-overlay.wrong{
  background:linear-gradient(180deg, #ff6b6b 0%, #e05a5a 100%);
  color:#fff; box-shadow:0 12px 40px rgba(224,90,90,.4);
}
.feedback-overlay.wrong .fb-title{ color:#fff; }
.feedback-overlay.wrong .fb-subtitle{ color:rgba(255,255,255,.9); }

@keyframes fbBounce{ 0%{transform:translate(-50%,-50%) scale(0.3)} 50%{transform:translate(-50%,-50%) scale(1.08)} 100%{transform:translate(-50%,-50%) scale(1)} }
.feedback-overlay.show{ animation:fbBounce .5s cubic-bezier(.34,1.56,.64,1); }

.result-overlay{
  position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center;
  padding:20px; background:rgba(58,42,31,0.4); backdrop-filter:blur(8px);
  opacity:0; visibility:hidden; transition:.3s;
}
.result-overlay.show{ opacity:1; visibility:visible; }
.result-card{
  max-width:480px; width:100%; text-align:center;
  background:rgba(255,247,239,0.96); border:2px solid var(--edge); backdrop-filter:blur(18px);
  border-radius:30px; padding:40px 30px; box-shadow:0 30px 60px rgba(90,50,20,.22);
  transform:scale(.8); transition:.35s cubic-bezier(.34,1.56,.64,1);
}
.result-overlay.show .result-card{ transform:scale(1); }
.result-badge{
  width:100px; height:100px; border-radius:50%; margin:0 auto 16px; font-size:50px;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%, #fff6c8, #f5c542 60%, #e8a317);
  box-shadow:0 0 30px rgba(245,197,66,.35); animation:badgePop .55s cubic-bezier(.34,1.56,.64,1);
}
@keyframes badgePop{0%{transform:scale(0) rotate(-30deg);}70%{transform:scale(1.12) rotate(6deg);}100%{transform:scale(1) rotate(0);}}
.result-card h2{ font-size:clamp(22px,4vw,30px); margin:0 0 14px; color:var(--ink); }
.result-stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:22px; }
.rstat{ background:rgba(240,122,46,0.08); border:1px solid var(--edge); border-radius:14px; padding:14px 8px; }
.rstat b{ display:block; font-family:'Fredoka',sans-serif; font-size:22px; color:var(--peach-deep); }
.rstat span{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; font-weight:800; }
.result-actions{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
.btn{ border:none; cursor:pointer; font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; padding:14px 24px; border-radius:999px;
  transition:transform .14s ease, box-shadow .14s ease; }
.btn:active{ transform:translateY(1px) scale(.98); }
.btn-primary{ background:linear-gradient(135deg, var(--peach), var(--peach-deep)); color:#fff; box-shadow:0 8px 20px rgba(240,122,46,0.3); }
.btn-primary:hover{ transform:translateY(-2px); }
.btn-ghost{ background:rgba(240,122,46,0.08); color:var(--ink-soft); border:2px solid var(--edge); }
.btn-ghost:hover{ border-color:var(--peach-deep); color:var(--ink); }

.float-banner{ position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-16px); z-index:700;
  font-family:'Fredoka',sans-serif; font-weight:700; padding:10px 24px; border-radius:999px; opacity:0; pointer-events:none;
  transition:all .3s cubic-bezier(.34,1.56,.64,1); font-size:15px; white-space:nowrap;}
.float-banner.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.float-banner.combo{ background:linear-gradient(135deg, var(--peach), var(--pink)); color:#fff; box-shadow:0 10px 24px rgba(255,143,179,.3);}

@media(max-width:1200px){ .question-text{font-size:clamp(18px,2.8vw,26px)} }
@media(max-width:900px){ .stage-wrap{ margin:12px 20px 18px; }.question-bar{padding:12px 14px}.question-text{font-size:clamp(16px,2.5vw,22px)} }
@media(max-width:600px){ .stage-wrap{ margin:10px 12px 16px; } }
@media(prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
@keyframes fadeSlide{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}

.progress-btn{ background:var(--panel); border:2px solid var(--edge); color:var(--ink); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px; position:relative; }
.progress-btn .badge{ position:absolute; top:-4px; right:-4px; background:var(--peach); color:#fff; font-size:10px; font-weight:800; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.progress-overlay{ position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; background:rgba(58,42,31,0.4); backdrop-filter:blur(8px); opacity:0; visibility:hidden; transition:.3s; }
.progress-overlay.show{ opacity:1; visibility:visible; }
.progress-card{ max-width:400px; width:90%; background:rgba(255,247,239,0.96); border:2px solid var(--edge); backdrop-filter:blur(18px); border-radius:24px; padding:28px 24px; box-shadow:0 20px 50px rgba(90,50,20,.22); transform:scale(.85); transition:.35s cubic-bezier(.34,1.56,.64,1); }
.progress-overlay.show .progress-card{ transform:scale(1); }
.progress-card h3{ font-family:'Fredoka',sans-serif; font-size:20px; margin:0 0 16px; text-align:center; color:var(--ink); }
.progress-list{ list-style:none; padding:0; margin:0; }
.progress-item{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:12px; margin-bottom:8px; background:rgba(240,122,46,0.06); border:1px solid rgba(240,122,46,0.12); }
.progress-item .num{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; background:rgba(240,122,46,0.1); color:var(--peach-deep); }
.progress-item .q-text{ flex:1; font-family:'Fredoka',sans-serif; font-size:14px; font-weight:500; color:var(--ink); }
.progress-item .status{ font-size:18px; flex-shrink:0; }
.progress-item.correct{ background:rgba(46,158,74,0.1); border-color:rgba(46,158,74,0.2); }
.progress-item.correct .num{ background:rgba(46,158,74,0.15); color:var(--success); }
.progress-item.wrong{ background:rgba(224,90,90,0.1); border-color:rgba(224,90,90,0.2); }
.progress-item.wrong .num{ background:rgba(224,90,90,0.15); color:var(--error); }
.progress-close{ display:block; margin:16px auto 0; font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; padding:10px 28px; border-radius:999px; border:none; background:linear-gradient(135deg, var(--peach), var(--peach-deep)); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(240,122,46,0.3); transition:transform .14s ease; }
.progress-close:hover{ transform:translateY(-2px); }
</style>
</head>
<body>
<canvas id="leaves" aria-hidden="true"></canvas>
<canvas id="fxCanvas" aria-hidden="true"></canvas>
<div class="float-banner" id="floatBanner"></div>

<div class="progress-overlay" id="progressOverlay">
  <div class="progress-card">
    <h3>📋 Answer Progress</h3>
    <ul class="progress-list" id="progressList"></ul>
    <button class="progress-close" id="progressClose">Got it!</button>
  </div>
</div>

<div class="hud">
  <div class="side"><a class="hud-back" href="../EVS_Index.html">← Menu</a></div>
  <div class="side">
    <div class="hud-chip">⭐ <span id="scoreDisplay">0</span></div>
    <div class="hud-chip">🔥 <span id="comboDisplay">x0</span></div>
    <div class="hud-chip" id="qCountDisplay">Q 1/5</div>
    <button class="progress-btn" id="progressBtn" title="Answer Progress">📋<span class="badge" id="progressBadge">0</span></button>
  </div>
  <div class="side"><button class="sound-toggle" id="soundToggle">🔊</button></div>
</div>

<div class="question-bar" id="questionBar">
  <div class="question-badge">💥 Smashing!</div>
  <div class="question-text" id="questionText">Loading...</div>
</div>

<div class="stage-wrap" id="stageWrap">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="feedback-overlay" id="feedback">
  <div class="fb-body">
    <div class="fb-title" id="fbTitle"></div>
    <div class="fb-subtitle" id="fbSubtitle"></div>
  </div>
</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-badge" id="resultBadge">🏆</div>
    <h2 id="resultTitle">Great Job!</h2>
    <div class="result-stats">
      <div class="rstat"><b id="resultScore">0</b><span>Score</span></div>
      <div class="rstat"><b id="resultCorrect">0/5</b><span>Correct</span></div>
      <div class="rstat"><b id="resultCombo">x0</b><span>Best Combo</span></div>
      <div class="rstat"><b id="resultStars">⭐⭐⭐</b><span>Rating</span></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="resultReplayBtn">🔁 Play Again</button>
      <button class="btn btn-primary" id="resultMenuBtn">🗺️ Menu</button>
    </div>
  </div>
</div>

<script>
/* PDF Exercise I — Tick the correct answer (answers from book content) */
const quizData = [
  {
    question: "Our body is divided into ______ main parts.",
    options: [
      { letter:"A", text:"1", image:"../assets/images/one.png" },
      { letter:"B", text:"2", image:"../assets/images/two.png" },
      { letter:"C", text:"3", image:"../assets/images/three.png" },
      { letter:"D", text:"4", image:"../assets/images/four.png" },
      { letter:"E", text:"5", image:"../assets/images/five.png" },
      { letter:"F", text:"6", image:"../assets/images/six.png" },
      { letter:"G", text:"7", image:"../assets/images/7.png" },
      { letter:"H", text:"8", image:"../assets/images/8.png" },
      { letter:"I", text:"9", image:"../assets/images/9.png" }
    ],
    answer: "C"
  },
  {
    question: "We hear with our ______.",
    options: [
      { letter:"A", text:"NOSE", image:"../assets/images/nose.png" },
      { letter:"B", text:"EARS", image:"../assets/images/ear.png" },
      { letter:"C", text:"EYES", image:"../assets/images/eye.png" },
      { letter:"D", text:"SKIN", image:"../assets/images/skin.png" },
      { letter:"E", text:"TONGUE", image:"../assets/images/tongue.png" },
      { letter:"F", text:"HANDS", image:"../assets/images/manoj.png" },
      { letter:"G", text:"LEGS", image:"../assets/images/legsoptions.png" },
      { letter:"H", text:"HAIR", image:"../assets/images/hair2.png" },
      { letter:"I", text:"TEETH", image:"../assets/images/teeth1.png" }
    ],
    answer: "B"
  },
  {
    question: "We breathe through our ______.",
    options: [
      { letter:"A", text:"EARS", image:"../assets/images/ear.png" },
      { letter:"B", text:"NOSE", image:"../assets/images/nose.png" },
      { letter:"C", text:"EYES", image:"../assets/images/eye.png" },
      { letter:"D", text:"SKIN", image:"../assets/images/skin.png" },
      { letter:"E", text:"TONGUE", image:"../assets/images/tongue.png" },
      { letter:"F", text:"HANDS", image:"../assets/images/manoj.png" },
      { letter:"G", text:"LEGS", image:"../assets/images/legsoptions.png" },
      { letter:"H", text:"HAIR", image:"../assets/images/hair2.png" },
      { letter:"I", text:"TEETH", image:"../assets/images/teeth1.png" }
    ],
    answer: "B"
  },
  {
    question: "Our hands are part of our ______.",
    options: [
      { letter:"A", text:"LEGS", image:"../assets/images/legsoptions.png" },
      { letter:"B", text:"FEET", image:"../assets/images/foot.png" },
      { letter:"C", text:"ARMS", image:"../assets/images/opt3.png" },
      { letter:"D", text:"TOES", image:"../assets/images/toes.png" },
      { letter:"E", text:"FINGERS", image:"../assets/images/fingers.png" },
      { letter:"F", text:"LIMBS", image:"../assets/images/limbs.png" },
      { letter:"G", text:"TRUNK", image:"../assets/images/trunk.png" },
      { letter:"H", text:"HAIR", image:"../assets/images/hair2.png" },
      { letter:"I", text:"BODY", image:"../assets/images/body.png" }
    ],
    answer: "C"
  },
  {
    question: "We should brush our teeth ______.",
    options: [
      { letter:"A", text:"ONCE A DAY", image:"../assets/images/once a day.png" },
      { letter:"B", text:"TWICE A WEEK", image:"../assets/images/twice a week.png" },
      { letter:"C", text:"ONCE A MONTH", image:"../assets/images/once a month.png" },
      { letter:"D", text:"TWICE A DAY", image:"../assets/images/twice a day.png" },
      { letter:"E", text:"THREE A DAY", image:"../assets/images/three.png" },
      { letter:"F", text:"ONCE A WEEK", image:"../assets/images/once a day.png" },
      { letter:"G", text:"NEVER", image:"../assets/images/once a month.png" },
      { letter:"H", text:"EVERY HOUR", image:"../assets/images/twice a week.png" },
      { letter:"I", text:"TWICE A MONTH", image:"../assets/images/twice a day.png" }
    ],
    answer: "D"
  }
];

let currentQ = 0, score = 0, combo = 0, bestCombo = 0, soundOn = true;
let questionResults = [], gameRunning = false;
let orbs = [], canvas, ctx, stageWrap, feedbackTimer = null;
let canvasW = 0, canvasH = 0;

const imgCache = {};
let imagesLoaded = false;
function loadAllImages(){
  const uniqueSrcs = [...new Set(quizData.flatMap(q => q.options.map(o => o.image).filter(Boolean)))];
  let loaded = 0;
  return new Promise(resolve => {
    if(uniqueSrcs.length === 0){ imagesLoaded = true; resolve(); return; }
    uniqueSrcs.forEach(src => {
      const img = new Image();
      img.onload = () => { imgCache[src] = img; loaded++; if(loaded >= uniqueSrcs.length){ imagesLoaded = true; resolve(); } };
      img.onerror = () => { imgCache[src] = null; loaded++; if(loaded >= uniqueSrcs.length){ imagesLoaded = true; resolve(); } };
      img.src = src;
    });
  });
}

const ORB_GRADIENTS = [
  ['#ffd0a8','#ff9f5a','#f07a2e'],
  ['#ffd0a8','#ffb07a','#f08a4b'],
  ['#ffc0d4','#ff7aa8','#e85484'],
  ['#ffe8a0','#f5c542','#e0a820'],
  ['#c8f0d0','#4ecb71','#2fa854'],
  ['#ffd8c0','#ff9e6b','#e07840']
];

let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,start,dur,type,peak){
  if(!audioCtx||!soundOn) return;
  type=type||'sine'; peak=peak||0.12;
  const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,audioCtx.currentTime+start);
  gain.gain.setValueAtTime(0,audioCtx.currentTime+start);
  gain.gain.linearRampToValueAtTime(peak,audioCtx.currentTime+start+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+start+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime+start); osc.stop(audioCtx.currentTime+start+dur+0.03);
}
function playSmash(){ tone(150,0,0.06,'square',0.1); tone(90,0.03,0.14,'sawtooth',0.09); }
function playCorrect(){ tone(523.25,0,0.13,'sine',0.14); tone(659.25,0.09,0.15,'sine',0.14); tone(783.99,0.18,0.2,'sine',0.14); }
function playWrong(){ tone(250,0,0.15,'sawtooth',0.08); tone(180,0.1,0.2,'sawtooth',0.07); }
function playCombo(){ tone(660,0,0.1,'triangle',0.1); tone(880,0.08,0.12,'triangle',0.1); }
function playFanfare(){ [392,523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*0.13,0.22,'triangle',0.13)); }
function speak(t){
  if(!soundOn||!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=0.98; u.pitch=1.05; speechSynthesis.speak(u); }catch(e){}
}

/* Soft floating bubbles (body theme) */
(function(){
  const c=document.getElementById('leaves'), cx=c.getContext('2d');
  let parts=[];
  const COLORS=['#ff9f5a','#ffb07a','#ff7aa8','#f5c542','#ffc08a','#ffd0a8'];
  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
  function make(){
    parts=[];
    const n=Math.floor((c.width*c.height)/26000);
    for(let i=0;i<n;i++){
      parts.push({
        x:Math.random()*c.width, y:Math.random()*c.height,
        size:Math.random()*8+4, speed:Math.random()*0.45+0.15,
        sway:Math.random()*Math.PI*2, swaySpeed:Math.random()*0.018+0.006,
        swayAmp:Math.random()*28+10,
        color:COLORS[Math.floor(Math.random()*COLORS.length)],
        opacity:Math.random()*0.35+0.15
      });
    }
  }
  function draw(){
    cx.clearRect(0,0,c.width,c.height);
    for(const p of parts){
      p.y-=p.speed; p.sway+=p.swaySpeed;
      if(p.y<-20){p.y=c.height+20;p.x=Math.random()*c.width;}
      const wx=p.x+Math.sin(p.sway)*p.swayAmp;
      cx.beginPath(); cx.arc(wx,p.y,p.size,0,Math.PI*2);
      cx.fillStyle=p.color; cx.globalAlpha=p.opacity; cx.fill();
      cx.beginPath(); cx.arc(wx-p.size*0.3,p.y-p.size*0.3,p.size*0.3,0,Math.PI*2);
      cx.fillStyle='#fff'; cx.globalAlpha=p.opacity*0.5; cx.fill();
      cx.globalAlpha=1;
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();make();}); resize(); make(); draw();
})();

const fxCanvas=document.getElementById('fxCanvas'), fxCtx=fxCanvas.getContext('2d');
function fxResize(){ fxCanvas.width=window.innerWidth; fxCanvas.height=window.innerHeight; }
window.addEventListener('resize',fxResize); fxResize();
let fxParts=[], fxRunning=false;
const FX_COLORS=['#ff9f5a','#ffb07a','#ff7aa8','#f5c542','#ffc08a','#fff7ef'];
function burstFX(x,y,count,colors){
  colors=colors||FX_COLORS;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*5+2;
    fxParts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,size:Math.random()*7+3,
      color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vr:(Math.random()-0.5)*12,life:0,maxLife:50+Math.random()*30});
  }
  if(!fxRunning){fxRunning=true;fxLoop();}
}
function fxLoop(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  fxParts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.rot+=p.vr; p.life++;
    fxCtx.save(); fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot*Math.PI/180);
    fxCtx.globalAlpha=Math.max(0,1-(p.life/p.maxLife)); fxCtx.fillStyle=p.color;
    fxCtx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); fxCtx.restore();
  });
  fxParts=fxParts.filter(p=>p.life<p.maxLife&&p.y<fxCanvas.height+60);
  if(fxParts.length>0) requestAnimationFrame(fxLoop); else { fxRunning=false; fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); }
}

let bannerTimer=null;
function showBanner(text){
  const el=document.getElementById('floatBanner');
  el.className='float-banner combo'; el.textContent=text;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>el.classList.remove('show'),1700);
}

function showFeedback(title, subtitle, type){
  const fb=document.getElementById('feedback');
  const fbTitle=document.getElementById('fbTitle');
  const fbSubtitle=document.getElementById('fbSubtitle');
  fbTitle.textContent=title;
  fbSubtitle.textContent=subtitle;
  fb.className='feedback-overlay '+type+' show';
  clearTimeout(feedbackTimer);
  feedbackTimer=setTimeout(()=>fb.classList.remove('show'),1800);
}

function createOrb(opt, isCorrect, totalOptions){
  const baseRadius = Math.min(80, Math.max(55, Math.min(canvasW, canvasH) * 0.1));
  const radius = totalOptions >= 7
    ? Math.min(baseRadius, Math.max(42, Math.min(canvasW, canvasH) * 0.065))
    : baseRadius;
  const grad = ORB_GRADIENTS[orbs.length % ORB_GRADIENTS.length];
  const angle = Math.random()*Math.PI*2;
  const speed = 0.45 + Math.random()*0.65;
  const pad = radius + 18;
  return {
    letter: opt.letter, text: opt.text, imageSrc: opt.image, isCorrect, radius,
    x: pad + Math.random()*(canvasW - pad*2),
    y: pad + Math.random()*(canvasH - pad*2),
    vx: Math.cos(angle)*speed,
    vy: Math.sin(angle)*speed,
    grad, smashed: false, smashTime: 0,
    spinPhase: Math.random()*Math.PI*2,
    spinSpeed: 0.018 + Math.random()*0.018,
    highlighted: false, highlightTime: 0,
    img: imgCache[opt.image] || null
  };
}

function loadQuestion(){
  if(currentQ >= quizData.length){ showResult(); return; }
  const q = quizData[currentQ];
  document.getElementById('qCountDisplay').textContent = `Q ${currentQ+1}/${quizData.length}`;
  document.getElementById('questionText').textContent = q.question;
  const bar = document.getElementById('questionBar');
  bar.style.animation = 'none'; void bar.offsetWidth;
  bar.style.animation = 'fadeSlide .4s ease';

  orbs = [];
  const shuffled = [...q.options].sort(()=>Math.random()-0.5);
  shuffled.forEach(opt => {
    orbs.push(createOrb(opt, opt.letter === q.answer, q.options.length));
  });
  gameRunning = true;
}

function gameLoop(){
  if(!gameRunning){ requestAnimationFrame(gameLoop); return; }
  const W = canvasW, H = canvasH;
  ctx.clearRect(0,0,W,H);

  orbs.forEach(p=>{
    if(p.smashed){
      const elapsed = Date.now() - p.smashTime;
      if(elapsed > 500) return;
      const scale = 1 - elapsed/500;
      ctx.save();
      ctx.globalAlpha = scale;
      ctx.translate(p.x, p.y);
      ctx.scale(scale, scale);
      drawOrb(ctx, p);
      ctx.restore();
      return;
    }
    if(p.reappearing){
      const elapsed = Date.now() - p.reappearTime;
      if(elapsed > 600){
        p.reappearing = false;
      } else {
        const scale = elapsed / 600;
        ctx.save();
        ctx.globalAlpha = scale;
        ctx.translate(p.x, p.y);
        ctx.scale(scale, scale);
        drawOrb(ctx, p);
        ctx.restore();
        return;
      }
    }
    if(p.highlighted){
      const elapsed = Date.now() - p.highlightTime;
      if(elapsed > 2000) return;
    }

    p.x += p.vx;
    p.y += p.vy;
    p.spinPhase += p.spinSpeed;

    if(p.x - p.radius < 0){ p.x = p.radius; p.vx *= -1; }
    if(p.x + p.radius > W){ p.x = W - p.radius; p.vx *= -1; }
    if(p.y - p.radius < 0){ p.y = p.radius; p.vy *= -1; }
    if(p.y + p.radius > H){ p.y = H - p.radius; p.vy *= -1; }

    drawOrb(ctx, p);
  });
  requestAnimationFrame(gameLoop);
}

function drawOrb(ctx, p){
  ctx.save();
  ctx.translate(p.x, p.y);

  const raw = Math.cos(p.spinPhase);
  const borderScale = Math.abs(raw) < 0.08 ? (raw < 0 ? -0.08 : 0.08) : raw;
  const ringW = 1.4;
  const r = p.radius;

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // Soft shadow only (not applied to the photo, which would blur it)
  ctx.save();
  ctx.scale(borderScale, 1);
  ctx.shadowColor = 'rgba(26,47,74,0.18)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Clip to the spinning ellipse, but draw the photo unscaled so it stays sharp
  ctx.save();
  ctx.scale(borderScale, 1);
  ctx.beginPath();
  ctx.arc(0, 0, r - ringW * 0.35, 0, Math.PI*2);
  ctx.clip();
  ctx.scale(1 / borderScale, 1);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-r, -r, r * 2, r * 2);

  if(p.img && imagesLoaded){
    const imgW = p.img.naturalWidth || p.img.width;
    const imgH = p.img.naturalHeight || p.img.height;
    const avail = (r - ringW) * 1.78;
    const ratio = Math.min(avail / imgW, avail / imgH);
    const dw = Math.round(imgW * ratio);
    const dh = Math.round(imgH * ratio);
    ctx.drawImage(p.img, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.fillStyle = 'rgba(26,47,74,0.9)';
    ctx.font = `bold ${Math.round(r * 0.5)}px 'Fredoka', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.text, 0, 0);
  }
  ctx.restore();

  ctx.save();
  ctx.scale(borderScale, 1);
  ctx.beginPath();
  ctx.arc(0, 0, r - ringW / 2, 0, Math.PI*2);
  ctx.strokeStyle = p.grad[2];
  ctx.lineWidth = ringW / Math.abs(borderScale);
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();

  if(p.highlighted){
    ctx.save();
    ctx.shadowColor = 'rgba(46,158,74,0.55)';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = '#2e9e4a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#1a2f4a';
  const labelSize = p.text.length > 8 ? Math.round(r * 0.32) : Math.round(r * 0.4);
  ctx.font = `800 ${labelSize}px 'Nunito', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(p.text, 0, r + 6);

  ctx.restore();
}

function onCanvasTap(e){
  if(!gameRunning) return;
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const tx = (e.clientX - rect.left) * (canvasW / rect.width);
  const ty = (e.clientY - rect.top) * (canvasH / rect.height);
  for(let i=orbs.length-1; i>=0; i--){
    const p = orbs[i];
    if(p.smashed || p.highlighted || p.reappearing) continue;
    const dx = tx - p.x, dy = ty - p.y;
    if(Math.sqrt(dx*dx+dy*dy) <= p.radius){
      onOrbHit(p);
      return;
    }
  }
}

function onOrbHit(p){
  const q = quizData[currentQ];
  if(p.isCorrect){
    playCorrect();
    p.highlighted = true;
    p.highlightTime = Date.now();
    p.vx = 0; p.vy = 0;
    const stageRect = stageWrap.getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    const sx = canvasW / canvasRect.width;
    const sy = canvasH / canvasRect.height;
    burstFX(stageRect.left + (p.x/sx), stageRect.top + (p.y/sy), 30, ['#2e9e4a','#ff9f5a','#f5c542','#fff7ef']);
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    score += 10 + combo*3;
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('comboDisplay').textContent = 'x'+combo;
    if(combo > 0 && combo%2===0){ showBanner(`🔥 COMBO x${combo}!`); playCombo(); }
    questionResults[currentQ] = 'correct';
    updateProgressBadge();
    showFeedback('YES! CORRECT!', 'Great job! Keep going!', 'correct');
    speak('Correct!');
    setTimeout(()=>{
      orbs.forEach(op=>{
        if(op !== p && !op.smashed){ op.smashed = true; op.smashTime = Date.now(); playSmash(); }
      });
    }, 400);
    setTimeout(()=>{ currentQ++; loadQuestion(); }, 1600);
  } else {
    playWrong();
    p.smashed = true;
    p.smashTime = Date.now();
    questionResults[currentQ] = 'wrong';
    combo = 0;
    document.getElementById('comboDisplay').textContent = 'x0';
    updateProgressBadge();
    showFeedback('AWESOME TRY!', 'Give it another go! Think carefully...', 'wrong');
    speak('Try again!');
    setTimeout(() => {
      p.smashed = false;
      p.reappearing = true;
      p.reappearTime = Date.now();
      const pad = p.radius + 18;
      p.x = pad + Math.random() * (canvasW - pad * 2);
      p.y = pad + Math.random() * (canvasH - pad * 2);
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.45 + Math.random() * 0.65;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
    }, 600);
  }
}

function showResult(){
  gameRunning = false;
  const correctCount = questionResults.filter(r=>r==='correct').length;
  const total = quizData.length;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultCorrect').textContent = `${correctCount}/${total}`;
  document.getElementById('resultCombo').textContent = 'x'+bestCombo;
  const pct = correctCount/total;
  document.getElementById('resultStars').textContent = pct===1?'⭐⭐⭐':pct>=0.6?'⭐⭐☆':'⭐☆☆';
  if(pct===1){
    document.getElementById('resultTitle').textContent='🌟 PERFECT!';
    document.getElementById('resultBadge').textContent='🌟';
    playFanfare(); speak('Perfect! You are amazing!');
  } else if(pct>=0.6){
    document.getElementById('resultTitle').textContent='Great Job!';
    document.getElementById('resultBadge').textContent='🏆';
    speak('Great job! You answered '+correctCount+' out of '+total+' correctly.');
  } else {
    document.getElementById('resultTitle').textContent='Keep Trying!';
    document.getElementById('resultBadge').textContent='💪';
    speak('Keep trying! You can do it!');
  }
  document.getElementById('resultOverlay').classList.add('show');
}

canvas = document.getElementById('gameCanvas');
ctx = canvas.getContext('2d');
stageWrap = document.getElementById('stageWrap');
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const w = stageWrap.clientWidth;
  const h = stageWrap.clientHeight;
  canvasW = w;
  canvasH = h;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
canvas.addEventListener('pointerdown', onCanvasTap);

document.getElementById('resultReplayBtn').addEventListener('click',()=>{
  ensureAudio(); tone(500,0,0.08,'triangle',0.09);
  currentQ=0; score=0; combo=0; bestCombo=0; questionResults=[];
  document.getElementById('scoreDisplay').textContent='0';
  document.getElementById('comboDisplay').textContent='x0';
  document.getElementById('resultOverlay').classList.remove('show');
  updateProgressBadge();
  loadQuestion();
});
document.getElementById('resultMenuBtn').addEventListener('click',()=>{
  ensureAudio(); tone(500,0,0.08,'triangle',0.09);
  window.location.href='../EVS_Index.html';
});
document.getElementById('soundToggle').addEventListener('click',()=>{
  soundOn=!soundOn;
  document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇';
  if(!soundOn&&'speechSynthesis' in window) speechSynthesis.cancel();
  else{ ensureAudio(); tone(500,0,0.08,'triangle',0.09); }
});

loadAllImages().then(()=>{
  loadQuestion();
  gameLoop();
});

// ---- Progress Modal ----
function updateProgressBadge(){
  const count = questionResults.filter(r => r === 'correct').length;
  document.getElementById('progressBadge').textContent = count;
}

function renderProgressList(){
  const list = document.getElementById('progressList');
  list.innerHTML = '';
  quizData.forEach((q, i) => {
    const li = document.createElement('li');
    const result = questionResults[i];
    let status = '○';
    let cls = '';
    let displayText = q.question;
    if(result === 'correct'){
      status = '✓';
      cls = 'correct';
      const answerIndex = q.answer.charCodeAt(0) - 65;
      const answerText = q.options[answerIndex] ? q.options[answerIndex].text : q.answer;
      displayText = q.question.replace('______', answerText);
    }
    else if(result === 'wrong'){
      status = '✗';
      cls = 'wrong';
      const answerIndex = q.answer.charCodeAt(0) - 65;
      const answerText = q.options[answerIndex] ? q.options[answerIndex].text : q.answer;
      displayText = q.question.replace('______', answerText);
    }
    li.className = 'progress-item' + (cls ? ' ' + cls : '');
    li.innerHTML = '<span class="num">' + (i+1) + '</span><span class="q-text">' + displayText + '</span><span class="status">' + status + '</span>';
    list.appendChild(li);
  });
}

document.getElementById('progressBtn').addEventListener('click', () => {
  renderProgressList();
  document.getElementById('progressOverlay').classList.add('show');
});
document.getElementById('progressClose').addEventListener('click', () => {
  document.getElementById('progressOverlay').classList.remove('show');
});
document.getElementById('progressOverlay').addEventListener('click', (e) => {
  if(e.target === e.currentTarget) document.getElementById('progressOverlay').classList.remove('show');
});
