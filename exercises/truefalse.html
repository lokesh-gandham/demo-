<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smash It! - True or False</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--peach:#ff9f5a;--peach-deep:#f07a2e;--ink:#3a2a1f;--ink-soft:#6a5240;--ink-dim:#8a7260;--edge:rgba(240,122,46,0.22)}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:'Fredoka',sans-serif;color:#3a2a1f;
  background:
    radial-gradient(ellipse 75% 45% at 92% -8%, rgba(255,180,90,0.5), transparent 55%),
    radial-gradient(ellipse 60% 40% at 8% 5%, rgba(255,140,150,0.25), transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 105%, rgba(110,210,130,0.2), transparent 55%),
    linear-gradient(180deg, #ffb39a 0%, #ffc9a0 22%, #ffe2b8 48%, #fff0d6 72%, #eaf8d8 100%);
  display:flex;flex-direction:column;
}

/* ===== HUD ===== */
.hud{position:relative;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 18px;background:rgba(255,247,239,0.88);backdrop-filter:blur(14px);
  border-bottom:2px solid rgba(240,122,46,0.22);box-shadow:0 2px 14px rgba(90,50,20,0.08)}
.hud .side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud-chip{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;color:#3a2a1f}
.timer-chip.warn{color:#e74c3c;border-color:#e74c3c;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.hud-back{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);color:#3a2a1f;padding:7px 15px;border-radius:999px;cursor:pointer;font-weight:800;font-size:13px;text-decoration:none}
.hud-back:hover{border-color:#f07a2e;color:#f07a2e;background:#fff}
.sound-toggle{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);color:#3a2a1f;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}
.progress-btn{background:rgba(255,255,255,0.88);border:2px solid rgba(240,122,46,0.22);color:#3a2a1f;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;position:relative}
.progress-btn .badge{position:absolute;top:-4px;right:-4px;background:#f07a2e;color:#fff;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* Hearts (kept for game logic) */
.hc{display:none}.hb{display:none}.hsd{display:none}
.hc-old{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,213,79,.25);color:#fff;font-size:14px;font-weight:700}
.hts{display:flex;gap:3px}.ht{font-size:17px;transition:.3s}.ht.lost{filter:grayscale(1) opacity(.35);transform:scale(.7)}

/* ===== TITLE + QUESTION ===== */
.question-bar{position:relative;z-index:10;width:100%;text-align:center;padding:16px 80px;
  background:rgba(255,247,239,0.88);backdrop-filter:blur(12px);border-bottom:2px solid rgba(240,122,46,0.22)}
.question-badge{display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff9f5a,#f07a2e);color:#fff;
  padding:6px 18px;border-radius:999px;
  font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;letter-spacing:.5px;margin-bottom:8px;
  box-shadow:0 3px 0 rgba(240,122,46,.28)}
.qtxt,.question-text{font-family:'Fredoka',sans-serif;font-size:clamp(22px,3.5vw,32px);font-weight:500;line-height:1.3;color:#3a2a1f}

.instruction{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:40;text-align:center;
  padding:6px 18px;border-radius:999px;background:rgba(255,159,90,0.92);
  color:#fff;font-size:15px;font-weight:400;font-family:'Fredoka',sans-serif;white-space:nowrap;
  box-shadow:0 3px 0 rgba(240,122,46,.28);animation:nudge 2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}

.stage-wrap{
  flex:1;position:relative;overflow:hidden;
  margin:12px 48px 18px;
  border-radius:24px;
  border:3px solid rgba(255,255,255,0.85);
  background:
    radial-gradient(ellipse 60% 50% at 50% 40%, rgba(255,255,255,0.45), transparent 70%),
    linear-gradient(180deg, rgba(255,232,200,0.55) 0%, rgba(220,245,200,0.55) 100%);
  box-shadow:0 10px 28px rgba(90,50,20,0.12), inset 0 0 40px rgba(255,255,255,0.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.stage-wrap.scene-shake{animation:sceneShake .45s ease}
@keyframes sceneShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ===== STONES ===== */
.stones{position:relative;z-index:30;margin:40px auto 20px;
  display:flex;gap:clamp(36px,10vw,120px);align-items:flex-end;justify-content:center}
.stone{cursor:pointer;position:relative;text-align:center;transition:transform .18s cubic-bezier(.34,1.4,.64,1);
  -webkit-tap-highlight-color:transparent;user-select:none}
.stone:hover:not(.broke):not(.dim){transform:translateY(-8px) scale(1.04)}
.stone:active:not(.broke){transform:scale(.96)}
.stone.dim{opacity:.28;pointer-events:none;filter:grayscale(.4);transform:scale(.9)}
.stone.broke{pointer-events:none}

.stone-body{width:clamp(130px,20vw,200px);height:clamp(110px,17vw,170px);position:relative;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}
.stone-body svg{width:100%;height:100%;display:block}
.stone-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:2;pointer-events:none}
.stone-icon{font-size:clamp(22px,3.4vw,34px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));line-height:1;font-weight:400}
.stone-label{font-family:'Nunito',sans-serif;font-size:clamp(20px,3.6vw,34px);font-weight:400;color:#f5f0e0;
  letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.4),0 4px 8px rgba(0,0,0,.5)}
.stone-glow{position:absolute;inset:-8%;border-radius:40%;opacity:0;pointer-events:none;transition:opacity .25s;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.stone:hover:not(.broke) .stone-glow{opacity:1}
.stone.true .stone-glow{background:radial-gradient(circle,rgba(180,160,120,.4),transparent 65%)}
.stone.false .stone-glow{background:radial-gradient(circle,rgba(140,130,110,.4),transparent 65%)}

.stone-crack{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:3}
.stone.cracking .stone-crack{opacity:1;animation:crackFlash .18s ease-out}
@keyframes crackFlash{0%{opacity:0}40%{opacity:1}100%{opacity:1}}

.stone.smash-hit{animation:stoneHit .28s ease-out}
@keyframes stoneHit{
  0%{transform:scale(1) rotate(0)}
  35%{transform:scale(1.08) rotate(-3deg)}
  70%{transform:scale(.92) rotate(2deg)}
  100%{transform:scale(1) rotate(0)}
}
.stone.shatter{animation:stoneShatter .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes stoneShatter{
  0%{transform:scale(1);opacity:1;filter:brightness(1)}
  25%{transform:scale(1.12);filter:brightness(1.4)}
  100%{transform:scale(.2) rotate(18deg);opacity:0;filter:brightness(2)}
}

/* floating idle */
.stone.true{animation:floatL 3.2s ease-in-out infinite}
.stone.false{animation:floatR 3.4s ease-in-out infinite .4s}
@keyframes floatL{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes floatR{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stone:hover,.stone.smash-hit,.stone.shatter,.stone.dim,.stone.broke{animation:none}

/* ===== HAMMER ===== */
.hero{position:absolute;bottom:12%;left:8%;z-index:42;width:clamp(100px,14vw,150px);height:clamp(100px,14vw,150px);
  pointer-events:none;transition:left .38s cubic-bezier(.22,.9,.3,1),bottom .38s cubic-bezier(.22,.9,.3,1);
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));overflow:visible}
.hero-boy{display:none!important}
/*
  Natural PNG: metal HEAD = top-right, stick = bottom-left.
  Keep near-natural angle so the HEAD stays on-screen and is the strike point.
*/
.hero-hammer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  transform-origin:70% 25%; /* pivot near metal head */
  transform:rotate(0deg);pointer-events:none;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:hamBob 2.4s ease-in-out infinite}
.hero.attacking .hero-hammer{animation:none;transform:rotate(-18deg) translate(-8px,-28px)}
.hero.swinging .hero-hammer{animation:hammerStrike .36s cubic-bezier(.2,.85,.2,1) forwards}
@keyframes hamBob{
  0%,100%{transform:rotate(0deg) translateY(0)}
  50%{transform:rotate(6deg) translateY(-8px)}
}
/* Raise then slam — metal HEAD (top-right) drives into the stone */
@keyframes hammerStrike{
  0%{transform:rotate(-22deg) translate(-10px,-32px) scale(1)}
  48%{transform:rotate(12deg) translate(6px,14px) scale(1.1)}
  65%{transform:rotate(4deg) translate(0,4px) scale(1)}
  100%{transform:rotate(0deg) translate(0,0) scale(1)}
}
.hero.cheer .hero-hammer{animation:hamCheer .5s ease-out}
@keyframes hamCheer{
  0%,100%{transform:rotate(0) scale(1)}
  40%{transform:rotate(-20deg) scale(1.12) translateY(-14px)}
  70%{transform:rotate(8deg) scale(1.05)}
}

/* ===== FX ===== */
.shard{position:fixed;z-index:50;pointer-events:none;border-radius:3px 8px 4px 6px;
  animation:shardFly .85s cubic-bezier(.15,.75,.3,1) forwards}
@keyframes shardFly{
  0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);opacity:0}
}
.dust{position:fixed;z-index:48;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(210,180,120,.55),rgba(160,130,80,.15) 55%,transparent 70%);
  animation:dustPop .7s ease-out forwards}
@keyframes dustPop{0%{transform:scale(.2);opacity:.8}100%{transform:scale(2.8);opacity:0}}
.shock{position:fixed;z-index:47;border:3px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;
  animation:shockwave .5s ease-out forwards}
@keyframes shockwave{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.spark{position:fixed;z-index:52;width:8px;height:8px;border-radius:50%;background:#ffe566;pointer-events:none;
  box-shadow:0 0 10px #ffb300;animation:sparkOut .55s ease-out forwards}
@keyframes sparkOut{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* ===== FEEDBACK ===== */
.fb{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;
  background:rgba(20,10,0,.25);backdrop-filter:blur(2px);transition:.3s}
.fb.show{opacity:1;visibility:visible}
.fb-c{min-width:270px;max-width:90vw;padding:26px 28px;text-align:center;border-radius:24px;
  background:linear-gradient(160deg,#fffef8,#fff3d6);box-shadow:0 22px 50px rgba(0,0,0,.35);transform:scale(.5);transition:.35s cubic-bezier(.34,1.4,.64,1)}
.fb.show .fb-c{transform:scale(1)}
.fb-e{font-size:64px;line-height:1}.fb-t{margin:8px 0 4px;font-size:26px;font-weight:700}
.fb-x{color:#6a5240;font-size:14px;font-weight:600}
.fb.ok .fb-c{border:3px solid #2e9e4a}.fb.ok .fb-t{color:#1b7a32}
.fb.no .fb-c{border:3px solid #e05a5a}.fb.no .fb-t{color:#c0392b}
.fb.fn .fb-c{border:4px solid #ffd54f}.fb.fn .fb-e{font-size:76px;animation:fE .7s ease-in-out infinite alternate}
.fb.fn .fb-t{font-size:30px;color:#3a2412}
@keyframes fE{from{transform:scale(1)}to{transform:scale(1.12) rotate(4deg)}}
.pa{display:none;margin-top:12px;min-width:150px;padding:12px 22px;border:0;border-radius:14px;
  background:linear-gradient(145deg,#ff8a50,#e85a20);color:#fff;font-family:'Fredoka',sans-serif;
  font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #b43a10;transition:transform .15s}
.pa:hover{transform:translateY(-2px)}

.cft{position:fixed;z-index:300;top:-14px;width:8px;height:13px;border-radius:2px;animation:cF 1.6s linear forwards}
@keyframes cF{to{transform:translate(var(--x),100vh) rotate(720deg);opacity:0}}

@media(max-width:768px){
  .stage-wrap{margin:10px 16px 14px}
  .stones{gap:clamp(20px,7vw,50px);margin-top:48px}
  .stone-body{width:clamp(110px,28vw,150px);height:clamp(95px,24vw,130px)}
  .qtxt,.question-text{font-size:clamp(18px,3vw,24px)}
  .hero{width:90px;height:90px;bottom:10%;left:6%}
  .hud{padding:8px 12px}
  .hud-chip{padding:5px 10px;font-size:13px;font-weight:800}
  .hud-back{padding:5px 12px;font-size:13px;font-weight:800}
  .sound-toggle{width:30px;height:30px;font-size:13px}
  .question-bar{padding:12px 20px}
  .question-badge{font-size:15px;font-weight:500}
}
@media(max-width:480px){
  .qtxt,.question-text{font-size:18px}.stone-label{font-size:14px;letter-spacing:1px}
  .stones{gap:clamp(15px,5vw,30px)}
  .stage-wrap{margin:8px 12px 12px}
}

.progress-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(58,42,31,0.4);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.3s}
.progress-overlay.show{opacity:1;visibility:visible}
.progress-card{max-width:400px;width:90%;background:rgba(255,247,239,0.96);border:2px solid var(--edge);backdrop-filter:blur(18px);border-radius:24px;padding:28px 24px;box-shadow:0 20px 50px rgba(90,50,20,.22);transform:scale(.85);transition:.35s cubic-bezier(.34,1.56,.64,1)}
.progress-overlay.show .progress-card{transform:scale(1)}
.progress-card h3{font-family:'Fredoka',sans-serif;font-size:20px;margin:0 0 16px;text-align:center;color:#3a2a1f}
.progress-list{list-style:none;padding:0;margin:0}
.progress-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:8px;background:rgba(240,122,46,0.06);border:1px solid rgba(240,122,46,0.15)}
.progress-item .num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;background:rgba(240,122,46,0.15);color:#f07a2e}
.progress-item .q-text{flex:1;font-family:'Fredoka',sans-serif;font-size:14px;font-weight:500;color:#3a2a1f}
.progress-item .status{font-size:18px;flex-shrink:0}
.progress-item.correct{background:rgba(46,158,74,0.1);border-color:rgba(46,158,74,0.25)}
.progress-item.correct .num{background:rgba(46,158,74,0.15);color:#2e9e4a}
.progress-item.wrong{background:rgba(224,90,90,0.1);border-color:rgba(224,90,90,0.2)}
.progress-item.wrong .num{background:rgba(224,90,90,0.15);color:#e05a5a}
.progress-close{display:block;margin:16px auto 0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;padding:10px 28px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--peach),var(--peach-deep));color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(240,122,46,0.3);transition:transform .14s ease}
.progress-close:hover{transform:translateY(-2px)}

.result-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(58,42,31,0.4);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.3s}
.result-overlay.show{opacity:1;visibility:visible}
.result-card{max-width:480px;width:100%;text-align:center;background:rgba(255,247,239,0.96);border:2px solid var(--edge);backdrop-filter:blur(18px);border-radius:30px;padding:40px 30px;box-shadow:0 30px 60px rgba(90,50,20,.22);transform:scale(.8);transition:.35s cubic-bezier(.34,1.56,.64,1)}
.result-overlay.show .result-card{transform:scale(1)}
.result-badge{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;font-size:50px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff6c8,#f5c542 60%,#e8a317);box-shadow:0 0 30px rgba(245,197,66,.35);animation:badgePop .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgePop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.result-card h2{font-family:'Fredoka',sans-serif;font-size:clamp(22px,4vw,30px);margin:0 0 14px;color:var(--ink)}
.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.rstat{background:rgba(240,122,46,0.08);border:1px solid var(--edge);border-radius:14px;padding:14px 8px}
.rstat b{display:block;font-family:'Fredoka',sans-serif;font-size:22px;color:var(--peach-deep)}
.rstat span{font-size:10.5px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.result-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;padding:14px 24px;border-radius:999px;transition:transform .14s ease,box-shadow .14s ease}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--peach),var(--peach-deep));color:#fff;box-shadow:0 8px 20px rgba(240,122,46,0.3)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:rgba(240,122,46,0.08);color:var(--ink-soft);border:2px solid var(--edge)}
.btn-ghost:hover{border-color:var(--peach-deep);color:var(--ink)}
</style>
</head>
<body>

<div class="hud">
  <div class="side"><a class="hud-back" href="../EVS_Index.html">← Menu</a></div>
  <div class="side">
    <div class="hud-chip">⭐ <span id="sD">0</span></div>
    <div class="hud-chip">🔥 <span id="cD">x0</span></div>
    <div class="hud-chip" id="qCountDisplay">Q 1/5</div>
    <button class="progress-btn" id="progressBtn" title="Answer Progress">📋<span class="badge" id="progressBadge">0</span></button>
  </div>
  <div class="side"><button class="sound-toggle" id="soundToggle">🔊</button>
    <div class="hud-chip timer-chip" id="timerChip">⏱️ 2:00</div>
  </div>
</div>

<div class="question-bar">
  <div class="question-badge">🔨 True or False</div>
  <div class="qtxt" id="qS"></div>
</div>

<div class="stage-wrap" id="stageWrap">
  <div class="instruction" id="instEl" style="display:none"></div>

  <div class="stones" id="stonesEl">
    <div class="stone true" id="stoneT" role="button" tabindex="0" aria-label="True">
      <div class="stone-glow"></div>
      <div class="stone-body">
        <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#9a8d7b"/>
              <stop offset="30%" stop-color="#7a6d5a"/>
              <stop offset="70%" stop-color="#5a4d3a"/>
              <stop offset="100%" stop-color="#4a3d2a"/>
            </linearGradient>
            <linearGradient id="tg2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="rgba(255,255,255,.25)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
            <filter id="stoneTexture">
              <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
              <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="2" result="light">
                <feDistantLight azimuth="45" elevation="55"/>
              </feDiffuseLighting>
              <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0" k3="0" k4="0"/>
            </filter>
          </defs>
          <ellipse cx="100" cy="158" rx="72" ry="10" fill="rgba(0,0,0,.22)"/>
          <path d="M28,48 C22,78 18,110 34,138 C48,158 78,164 102,162 C138,160 168,150 178,124 C188,96 182,62 160,42 C138,22 98,18 68,26 C48,32 32,38 28,48Z" fill="url(#tg)" stroke="#3a2d1a" stroke-width="3"/>
          <path d="M28,48 C22,78 18,110 34,138 C48,158 78,164 102,162 C138,160 168,150 178,124 C188,96 182,62 160,42 C138,22 98,18 68,26 C48,32 32,38 28,48Z" fill="url(#tg2)"/>
          <path d="M48,40 C70,28 110,26 140,36 C118,34 84,38 58,50Z" fill="rgba(255,255,255,.15)"/>
          <path d="M55,70 Q72,62 88,74" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4" stroke-linecap="round"/>
          <path d="M110,88 Q130,80 148,96" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="62" cy="100" r="7" fill="rgba(0,0,0,.1)"/>
          <circle cx="145" cy="118" r="5" fill="rgba(0,0,0,.08)"/>
          <path d="M40,55 L45,65 M155,145 L162,150 M170,95 L178,100" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="stone-crack" viewBox="0 0 200 170">
          <path d="M100,30 L92,70 L110,95 L88,130 L105,155" fill="none" stroke="#2a1d0a" stroke-width="3" stroke-linecap="round"/>
          <path d="M92,70 L70,85" fill="none" stroke="#2a1d0a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M110,95 L135,105" fill="none" stroke="#2a1d0a" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="stone-face">
          <div class="stone-icon">✅</div>
          <div class="stone-label">TRUE</div>
        </div>
      </div>
    </div>

    <div class="stone false" id="stoneF" role="button" tabindex="0" aria-label="False">
      <div class="stone-glow"></div>
      <div class="stone-body">
        <svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7a7062"/>
              <stop offset="30%" stop-color="#625848"/>
              <stop offset="70%" stop-color="#4a4035"/>
              <stop offset="100%" stop-color="#3a3028"/>
            </linearGradient>
            <linearGradient id="fg2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="rgba(255,255,255,.2)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
            </linearGradient>
          </defs>
          <ellipse cx="100" cy="158" rx="72" ry="10" fill="rgba(0,0,0,.24)"/>
          <path d="M32,52 C24,80 20,112 38,138 C54,158 84,165 108,162 C144,158 172,146 180,118 C190,88 176,56 152,40 C126,22 90,20 64,30 C48,36 36,44 32,52Z" fill="url(#fg)" stroke="#2a2018" stroke-width="3"/>
          <path d="M32,52 C24,80 20,112 38,138 C54,158 84,165 108,162 C144,158 172,146 180,118 C190,88 176,56 152,40 C126,22 90,20 64,30 C48,36 36,44 32,52Z" fill="url(#fg2)"/>
          <path d="M50,42 C78,28 118,28 148,40 C120,34 86,38 60,52Z" fill="rgba(255,255,255,.12)"/>
          <path d="M58,78 Q78,68 96,82" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4" stroke-linecap="round"/>
          <path d="M112,92 Q132,84 150,100" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="70" cy="112" r="6" fill="rgba(0,0,0,.1)"/>
          <circle cx="140" cy="70" r="5" fill="rgba(0,0,0,.09)"/>
          <path d="M45,60 L50,70 M150,140 L158,148 M165,90 L172,96" fill="none" stroke="rgba(0,0,0,.1)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="stone-crack" viewBox="0 0 200 170">
          <path d="M102,28 L96,68 L118,92 L90,128 L108,156" fill="none" stroke="#1a1008" stroke-width="3" stroke-linecap="round"/>
          <path d="M96,68 L72,82" fill="none" stroke="#1a1008" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M118,92 L142,100" fill="none" stroke="#1a1008" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="stone-face">
          <div class="stone-icon">❌</div>
          <div class="stone-label">FALSE</div>
        </div>
      </div>
    </div>
  </div>

  <div class="hero" id="hero">
    <img class="hero-hammer" src="../assets/images/hammer-removebg-preview.png" alt="Hammer">
  </div>
</div>

<div class="fb" id="fb"><div class="fb-c">
  <div class="fb-e" id="fE"></div>
  <h2 class="fb-t" id="fT"></h2>
  <p class="fb-x" id="fX"></p>
  <button class="pa" id="pA" type="button">🔄 Play Again</button>
</div></div>

<div class="progress-overlay" id="progressOverlay">
  <div class="progress-card">
    <h3>📋 Answer Progress</h3>
    <ul class="progress-list" id="progressList"></ul>
    <button class="progress-close" id="progressClose">Got it!</button>
  </div>
</div>

<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-badge" id="resultBadge">🏆</div>
    <h2 id="resultTitle">Great Job!</h2>
    <div class="result-stats">
      <div class="rstat"><b id="resultScore">0</b><span>Score</span></div>
      <div class="rstat"><b id="resultCorrect">0/5</b><span>Correct</span></div>
      <div class="rstat"><b id="resultCombo">x0</b><span>Best Combo</span></div>
      <div class="rstat"><b id="resultStars">⭐⭐⭐</b><span>Rating</span></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="resultReplayBtn">🔁 Play Again</button>
      <button class="btn btn-primary" id="resultMenuBtn">🗺️ Menu</button>
    </div>
  </div>
</div>

<script>
(function(){
  var quiz=[
    {s:"Our eyes help us listen.",a:false},
    {s:"Each hand has ten fingers.",a:false},
    {s:"We can see the world with our limbs.",a:false},
    {s:"Our legs help us eat and pick things.",a:false},
    {s:"Our skin helps us feel.",a:true}
  ];

  var cQ=0,score=0,combo=0,wrongs=0,locked=false,sndOn=true;
  var questionResults=[];
  var timerRemaining=120,timerInterval=null;

  function renderTimer(){
    var el=document.getElementById('timerChip');
    var m=Math.floor(timerRemaining/60),s=timerRemaining%60;
    el.textContent='⏱️ '+m+':'+(s<10?'0':'')+s;
    if(timerRemaining<=30){el.classList.add('warn')}else{el.classList.remove('warn')}
  }
  function startTimer(){
    stopTimer();timerRemaining=120;renderTimer();
    timerInterval=setInterval(function(){
      timerRemaining--;renderTimer();
      if(timerRemaining<=0){stopTimer();showTimeUp()}
    },1000);
  }
  function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
  function showTimeUp(){
    var correct=quiz.length-wrongs;
    document.getElementById('resultBadge').textContent='⏰';
    document.getElementById('resultTitle').textContent="Time's Up!";
    document.getElementById('resultTitle').style.color='#e74c3c';
    document.getElementById('resultScore').textContent=score;
    document.getElementById('resultCorrect').textContent=correct+'/'+quiz.length;
    document.getElementById('resultCombo').textContent='x'+combo;
    document.getElementById('resultStars').textContent='⏰';
    document.getElementById('resultOverlay').classList.add('show');
  }
  var qS=document.getElementById("qS"),sD=document.getElementById("sD"),cD=document.getElementById("cD");
  var qD=document.getElementById("qCountDisplay"),fb=document.getElementById("fb");
  var fE=document.getElementById("fE"),fT=document.getElementById("fT"),fX=document.getElementById("fX");
  var pA=document.getElementById("pA"),sndB=document.getElementById("soundToggle");
  var hero=document.getElementById("hero"),instEl=document.getElementById("instEl");
  var stoneT=document.getElementById("stoneT"),stoneF=document.getElementById("stoneF");
  var stageWrap=document.getElementById("stageWrap");
  var heroHome={left:"8%",bottom:"12%"};

  var actx=null;
  function eA(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}if(actx&&actx.state==="suspended")actx.resume()}
  function tn(f,s,d,t,p){if(!actx||!sndOn)return;t=t||"sine";p=p||.12;var o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,actx.currentTime+s);g.gain.setValueAtTime(0,actx.currentTime+s);g.gain.linearRampToValueAtTime(p,actx.currentTime+s+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+s+d);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+s);o.stop(actx.currentTime+s+d+.03)}
  function pC(){tn(523,0,.1);tn(659,.08,.12);tn(784,.16,.15)}
  function pW(){tn(250,0,.12,"sawtooth",.08);tn(180,.08,.15,"sawtooth",.06)}
  function pB(){tn(660,0,.08,"triangle",.1);tn(880,.06,.1,"triangle",.1)}
  function pF(){[392,523,659,784,1047].forEach(function(f,i){tn(f,i*.1,.18,"triangle",.12)})}
  function pS(){tn(110,0,.07,"sawtooth",.16);tn(70,.04,.12,"sawtooth",.12);tn(40,.08,.18,"square",.07)}
  function spk(t){if(!sndOn||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}

  function conf(n){
    var cs=["#ff4d6d","#ffd43b","#31c76a","#4da3ff","#a85ee8","#ff8c42"];
    for(var i=0;i<n;i++){
      var p=document.createElement("div");p.className="cft";
      p.style.left=Math.random()*100+"vw";p.style.background=cs[Math.floor(Math.random()*cs.length)];
      p.style.setProperty("--x",(Math.random()*400-200)+"px");p.style.animationDelay=Math.random()*.25+"s";
      document.body.appendChild(p);setTimeout(function(el){return function(){el.remove()}}(p),1800);
    }
  }

  function smashFX(x,y,isTrue){
    var colors=isTrue?["#9a8d7b","#7a6d5a","#b8a890","#5a4d3a","#c8b8a0"]:["#7a7062","#625848","#8a8070","#4a4035","#9a9080"];
    var i,el;
    for(i=0;i<18;i++){
      el=document.createElement("div");el.className="shard";
      el.style.left=x+"px";el.style.top=y+"px";
      el.style.background=colors[Math.floor(Math.random()*colors.length)];
      el.style.width=(8+Math.random()*16)+"px";el.style.height=(7+Math.random()*14)+"px";
      el.style.setProperty("--dx",(Math.random()*220-110)+"px");
      el.style.setProperty("--dy",(-40-Math.random()*160)+"px");
      el.style.setProperty("--rot",(Math.random()*520-260)+"deg");
      el.style.animationDelay=(Math.random()*0.08)+"s";
      document.body.appendChild(el);setTimeout(function(n){return function(){n.remove()}}(el),900);
    }
    for(i=0;i<5;i++){
      el=document.createElement("div");el.className="dust";
      el.style.left=(x-25+Math.random()*50)+"px";el.style.top=(y-15+Math.random()*30)+"px";
      el.style.width=(40+Math.random()*50)+"px";el.style.height=(28+Math.random()*35)+"px";
      document.body.appendChild(el);setTimeout(function(n){return function(){n.remove()}}(el),750);
    }
    el=document.createElement("div");el.className="shock";
    el.style.left=x+"px";el.style.top=y+"px";el.style.width="40px";el.style.height="40px";
    document.body.appendChild(el);setTimeout(function(){el.remove()},520);
    for(i=0;i<10;i++){
      el=document.createElement("div");el.className="spark";
      el.style.left=x+"px";el.style.top=y+"px";
      el.style.setProperty("--dx",(Math.random()*120-60)+"px");
      el.style.setProperty("--dy",(Math.random()*120-60)+"px");
      document.body.appendChild(el);setTimeout(function(n){return function(){n.remove()}}(el),600);
    }
    if(stageWrap){
      stageWrap.classList.remove("scene-shake");void stageWrap.offsetWidth;stageWrap.classList.add("scene-shake");
      setTimeout(function(){stageWrap.classList.remove("scene-shake")},500);
    }
  }

  function resetHero(){
    hero.classList.remove("attacking","swinging","cheer");
    hero.style.left=heroHome.left;
    hero.style.bottom=heroHome.bottom;
    hero.style.transform="";
  }

  function heroSmash(stoneEl,done){
    var sr=stageWrap?stageWrap.getBoundingClientRect():{left:0,bottom:window.innerHeight,width:window.innerWidth,height:window.innerHeight};
    var r=stoneEl.getBoundingClientRect();
    var hw=hero.offsetWidth||150;
    var hh=hero.offsetHeight||150;
    /* Natural PNG: metal HEAD is top-right (~72% x, ~28% y). */
    var headX=0.72;
    var headY=0.28;
    var contactX=r.left+r.width*0.5;
    var contactY=r.top+r.height*0.32;
    var targetLeft=Math.round(contactX-sr.left-hw*headX);
    var targetBottom=Math.round(sr.bottom-contactY-hh*(1-headY));
    targetLeft=Math.max(4,Math.min(targetLeft,sr.width-hw-4));
    targetBottom=Math.max(8,Math.min(targetBottom,sr.height*0.55));

    hero.classList.remove("cheer","swinging");
    hero.classList.add("attacking");
    hero.style.left=targetLeft+"px";
    hero.style.bottom=targetBottom+"px";

    setTimeout(function(){
      hero.classList.add("swinging");
      setTimeout(function(){
        if(done)done();
        setTimeout(function(){
          hero.classList.remove("swinging","attacking");
          hero.style.left=heroHome.left;
          hero.style.bottom=heroHome.bottom;
        },280);
      },175);
    },380);
  }

  function resetStones(){
    [stoneT,stoneF].forEach(function(s){
      s.classList.remove("broke","dim","cracking","smash-hit","shatter");
      s.style.opacity="";s.style.transform="";s.style.pointerEvents="";
    });
    resetHero();
  }

  function loadQ(){
    if(cQ>=quiz.length){showFin();return}
    locked=false;resetStones();
    var q=quiz[cQ];
    qS.textContent=q.s;
    qD.textContent=(cQ+1)+"/"+quiz.length;
    sD.textContent=score;cD.textContent="x"+combo;
    instEl.textContent="Smash the correct stone!";
  }

  function pickStone(ans){
    if(locked)return;
    eA();locked=true;
    var q=quiz[cQ],correct=ans===q.a;
    var chosen=ans?stoneT:stoneF;
    var other=ans?stoneF:stoneT;
    var r=chosen.getBoundingClientRect();
    var cx=r.left+r.width/2, cy=r.top+r.height/2;

    heroSmash(chosen,function(){
      pS();
      chosen.classList.add("cracking","smash-hit");
      smashFX(cx,cy,ans);

      setTimeout(function(){
        chosen.classList.add("shatter","broke");
        if(correct){
          other.classList.add("dim");
          combo++;score+=12+combo*3;sD.textContent=score;cD.textContent="x"+combo;
          pC();conf(28);
          hero.classList.remove("cheer");void hero.offsetWidth;hero.classList.add("cheer");
          questionResults[cQ]="correct";
          updateProgressBadge();
          sFB("ok","🎉","Correct!","Awesome smash!");
          spk("Correct!");
          if(combo>=2){pB();showBn("COMBO x"+combo+"!")}
          setTimeout(function(){fb.classList.remove("show");cQ++;loadQ()},1400);
        }else{
          combo=0;cD.textContent="x0";wrongs++;
          questionResults[cQ]="wrong";
          updateProgressBadge();
          pW();
          sFB("no","😅","Oops!","Try the other stone!");
          spk("Try again!");
          setTimeout(function(){
            fb.classList.remove("show");
            chosen.classList.remove("shatter","broke","cracking","smash-hit");
            chosen.style.opacity="1";
            locked=false;
          },1200);
        }
      },120);
    });
  }

  function showBn(t){
    var el=document.getElementById("flB");
    if(!el){
      el=document.createElement("div");el.id="flB";
      el.style.cssText="position:fixed;top:100px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:150;font-family:Fredoka,sans-serif;font-weight:700;padding:8px 22px;border-radius:999px;background:linear-gradient(135deg,#ff9f5a,#ff7aa8);color:#fff;font-size:15px;opacity:0;pointer-events:none;transition:.35s;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.28)";
      document.body.appendChild(el);
    }
    el.textContent=t;el.style.opacity="0";
    requestAnimationFrame(function(){el.style.opacity="1";el.style.transform="translateX(-50%) translateY(0)"});
    clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity="0";el.style.transform="translateX(-50%) translateY(-10px)"},1200);
  }

  function sFB(tp,e,t,x){
    fb.className="fb "+tp+" show";
    fE.textContent=e;fT.textContent=t;fX.textContent=x||"";
    pA.style.display=tp==="fn"?"inline-block":"none";
    if(tp!=="fn")setTimeout(function(){fb.classList.remove("show")},900);
  }

  function showFin(){
    stopTimer();
    document.getElementById('resultTitle').style.color='';
    var correct=quiz.length-wrongs;
    var pct=correct/quiz.length;
    var em,ti;
    if(wrongs===0){em="🌟";ti="PERFECT!";pF();spk("Perfect!")}
    else if(wrongs<=2){em="🏆";ti="Great Job!";spk("Great job!")}
    else{em="🌟";ti="Nice Work!";spk("Nice work!")}
    document.getElementById('resultBadge').textContent=em;
    document.getElementById('resultTitle').textContent=ti;
    document.getElementById('resultScore').textContent=score;
    document.getElementById('resultCorrect').textContent=correct+'/'+quiz.length;
    document.getElementById('resultCombo').textContent='x'+combo;
    document.getElementById('resultStars').textContent=pct===1?'⭐⭐⭐':pct>=0.6?'⭐⭐☆':'⭐☆☆';
    setTimeout(function(){
      document.getElementById('resultOverlay').classList.add('show');
      conf(55);setTimeout(function(){conf(30)},300);
    },400);
  }

  stoneT.addEventListener("click",function(){pickStone(true)});
  stoneF.addEventListener("click",function(){pickStone(false)});
  stoneT.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")pickStone(true)});
  stoneF.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")pickStone(false)});

  pA.addEventListener("click",function(){
    fb.classList.remove("show","ok","no","fn");
    cQ=0;score=0;combo=0;wrongs=0;locked=false;
    sD.textContent="0";cD.textContent="x0";
    setTimeout(loadQ,300);
  });
  document.getElementById('resultReplayBtn').addEventListener('click',function(){
    document.getElementById('resultOverlay').classList.remove('show');
    document.getElementById('resultTitle').style.color='';
    cQ=0;score=0;combo=0;wrongs=0;locked=false;
    sD.textContent="0";cD.textContent="x0";
    questionResults=[];
    setTimeout(function(){loadQ();startTimer()},300);
  });
  document.getElementById('resultMenuBtn').addEventListener('click',function(){
    window.location.href='../EVS_Index.html';
  });
  sndB.addEventListener("click",function(){
    sndOn=!sndOn;sndB.textContent=sndOn?"🔊":"🔇";
    if(!sndOn&&"speechSynthesis" in window)speechSynthesis.cancel();
  });

  function updateProgressBadge(){
    var count=0;
    for(var i=0;i<questionResults.length;i++){if(questionResults[i]==="correct")count++}
    document.getElementById('progressBadge').textContent=count;
  }

  function renderProgressList(){
    var list=document.getElementById('progressList');
    list.innerHTML='';
    quiz.forEach(function(q,i){
      var li=document.createElement('li');
      var result=questionResults[i];
      var status='○';
      var cls='';
      var displayText='???';
      if(result==='correct'){status='✓';cls='correct';displayText=q.s+' → '+(q.a?'TRUE':'FALSE')}
      else if(result==='wrong'){status='✗';cls='wrong';displayText=q.s+' → '+(q.a?'TRUE':'FALSE')}
      li.className='progress-item'+(cls?' '+cls:'');
      li.innerHTML='<span class="num">'+(i+1)+'</span><span class="q-text">'+displayText+'</span><span class="status">'+status+'</span>';
      list.appendChild(li);
    });
  }

  document.getElementById('progressBtn').addEventListener('click',function(){
    renderProgressList();
    document.getElementById('progressOverlay').classList.add('show');
  });
  document.getElementById('progressClose').addEventListener('click',function(){
    document.getElementById('progressOverlay').classList.remove('show');
  });
  document.getElementById('progressOverlay').addEventListener('click',function(e){
    if(e.target===e.currentTarget)document.getElementById('progressOverlay').classList.remove('show');
  });

  loadQ();
  startTimer();
})();
</script>
