<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Parts - Fill in the Blanks</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;
    background:#fff;
    color:#12246d;
    overflow-x:hidden;
}

/* ================================
   MAIN PAGE
================================ */

.quiz-page{
    min-height:100vh;
    padding:28px 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
}

.quiz-card{
    width:100%;
    max-width:1500px;
    min-height:calc(100vh - 56px);
    padding:42px 46px 32px;
    border:2px solid #a7ddf7;
    border-radius:32px;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(255,255,255,.65),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #dff7ff,
            #bcecff
        );

    box-shadow:
        0 8px 25px rgba(41,133,180,.15);

    display:flex;
    flex-direction:column;
}

/* ================================
   TOP CONTENT
================================ */

.quiz-content{
    flex:1;

    display:grid;
    grid-template-columns:minmax(0, 0.95fr) minmax(0, 1.05fr);
    gap:clamp(20px, 2.5vw, 42px);

    align-items:center;
}

/* ================================
   IMAGE
================================ */

.image-section{
    width:100%;
    height:540px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.image-frame{
    width:100%;
    max-width:650px;
    height:100%;

    border:7px solid #fff;
    border-radius:34px;

    overflow:hidden;

    background:#8edcf4;

    box-shadow:
        0 5px 0 rgba(38,132,181,.12),
        0 12px 28px rgba(0,0,0,.13);
}

.image-frame img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:
        opacity .25s ease,
        transform .35s ease;
}

.image-frame img.image-changing{
    opacity:0;
    transform:scale(.96);
}

/* ================================
   QUESTION SIDE
================================ */

.question-section{
    width:100%;
    padding:0 5px;
}

.question-number{
    width:70px;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #37a9eb,
            #197bc8
        );

    color:#fff;

    font-size:39px;
    font-weight:900;

    box-shadow:
        0 5px 0 #1165a7;

    margin-bottom:22px;
    display:none;
}

.question{
    color:#10236d;

    font-size:
        clamp(38px,4vw,68px);

    line-height:1.28;

    font-weight:900;

    letter-spacing:-1.5px;

    max-width:100%;
    overflow-wrap:normal;
    word-break:normal;

    animation:
        questionEnter .5s ease;
}

@keyframes questionEnter{

    from{
        opacity:0;
        transform:translateX(35px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}

.question-line{
    display:block;
    width:100%;
    max-width:100%;
    overflow-wrap:normal;
    word-break:normal;
}

.answer-area{
    display:contents;
}

/*
   Each answer box behaves like part of the question text.
   If there is enough room, boxes stay on the same line.
   If there is not enough room, they automatically move
   to the next line.
*/
.answer-area .answer-box{
    display:inline-flex;
    vertical-align:middle;

    margin:0 3px 5px;

    flex:none;
}

.answer-box{
    width:
        clamp(48px,4.4vw,72px);

    height:
        clamp(48px,4.4vw,72px);

    border:2px dashed #2999ed;

    border-radius:11px;

    background:
        rgba(255,255,255,.8);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#11246d;

    font-size:
        clamp(25px,2.5vw,43px);

    font-weight:900;

    transition:
        .2s ease;
}

.answer-box.filled{
    border-style:solid;
    background:#fff;

    box-shadow:
        0 4px 10px
        rgba(40,146,212,.15);
}

.answer-box.correct{
    background:#d8ffdf;
    border-color:#30b856;
    color:#16853a;
}

.answer-box.drag-over{
    transform:scale(1.08);
    background:#e8f8ff;
    border-color:#168bd5;
}

/* ================================
   INSTRUCTION
================================ */

.instruction{
    width:max-content;
    max-width:100%;

    margin:
        18px auto 28px;

    padding:
        15px 42px;

    border-radius:45px;

    background:
        rgba(86,187,232,.30);

    color:#10236d;

    font-size:
        clamp(18px,1.65vw,28px);

    font-weight:900;

    text-align:center;
}

/* ================================
   LETTERS
================================ */

.letters{
    width:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:
        clamp(12px,2.1vw,32px);

    flex-wrap:wrap;

    min-height:125px;
}

.letter-tile{
    width:
        clamp(76px,8vw,125px);

    height:
        clamp(76px,8vw,125px);

    border-radius:22px;

    border:2px solid #dce8f0;

    background:#fff;

    color:#10236d;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:
        clamp(34px,4vw,62px);

    font-weight:900;

    cursor:default;

    user-select:none;

    box-shadow:
        0 7px 0 #c5dbe9,
        0 10px 18px
        rgba(43,136,183,.15);

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.letter-tile:hover{
    transform:translateY(-5px);
}

.letter-tile:active{
    
    cursor:default;
    transform:translateY(3px);
}

.letter-tile.used{
    opacity:.25;
    cursor:not-allowed;
    transform:none;
}

.letter-tile.wrong{
    animation:
        wrongLetter .45s ease;
}

@keyframes wrongLetter{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-10px) rotate(-3deg);
    }

    50%{
        transform:translateX(10px) rotate(3deg);
    }

    75%{
        transform:translateX(-6px);
    }
}

/* ================================
   NAVIGATION
================================ */

.navigation{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-top:28px;
}

.nav-button{
    min-width:270px;
    height:78px;

    border:0;
    border-radius:45px;

    background:
        linear-gradient(
            145deg,
            #8e3de7,
            #6420cb
        );

    color:#fff;

    font-size:30px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 0 #4c159e,
        0 10px 20px
        rgba(92,32,180,.25);

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.nav-button:hover:not(:disabled){
    transform:translateY(-4px);
}

.nav-button:active:not(:disabled){
    transform:translateY(4px);

    box-shadow:
        0 3px 0 #4c159e;
}

.nav-button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* ================================
   EMOJI POPUP
================================ */

.answer-popup{
    position:fixed;

    left:50%;
    top:50%;

    width:190px;
    height:190px;

    border-radius:50%;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:110px;

    z-index:5000;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,-50%)
        scale(.4);

    box-shadow:
        0 18px 50px
        rgba(0,0,0,.25);
}

.answer-popup.show{
    animation:
        emojiPopup .9s ease forwards;
}

@keyframes emojiPopup{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.4)
            rotate(-12deg);
    }

    45%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.15)
            rotate(8deg);
    }

    70%{
        transform:
            translate(-50%,-50%)
            scale(.96)
            rotate(-3deg);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* ================================
   FINAL POPUP
================================ */

.final-popup{
    position:fixed;
    inset:0;

    z-index:6000;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(13,36,88,.45);

    backdrop-filter:blur(5px);
}

.final-popup.show{
    display:flex;
}

.final-box{
    width:min(540px,90vw);

    padding:45px 30px;

    border-radius:35px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #fff,
            #e8faff
        );

    box-shadow:
        0 25px 65px
        rgba(0,0,0,.25);

    animation:
        finalPopupIn .5s ease;
}

@keyframes finalPopupIn{

    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.final-emoji{
    font-size:90px;
}

.final-box h2{
    color:#172b7d;
    font-size:44px;
    margin:8px 0 10px;
}

.final-box p{
    color:#36548d;
    font-size:22px;
    font-weight:800;
}

.play-again{
    margin-top:25px;

    min-width:230px;
    height:62px;

    border:0;
    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            #8e3de7,
            #6420cb
        );

    color:#fff;

    font-size:22px;
    font-weight:900;

    cursor:pointer;
}


/* ================================
   FULLSCREEN BUTTON
================================ */

.fullscreen-button{
    position:fixed;
    right:24px;
    bottom:24px;
    width:58px;
    height:58px;

    border:2px solid rgba(255,255,255,.9);
    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #8e3de7,
            #6420cb
        );

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    font-weight:900;

    cursor:pointer;
    z-index:7000;

    box-shadow:
        0 5px 0 #4c159e,
        0 8px 18px rgba(75,31,155,.28);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.fullscreen-button:hover{
    transform:translateY(-4px) scale(1.04);
}

.fullscreen-button:active{
    transform:translateY(2px);
    box-shadow:
        0 2px 0 #4c159e,
        0 5px 12px rgba(75,31,155,.22);
}

.fullscreen-button:focus-visible{
    outline:3px solid #37a9eb;
    outline-offset:4px;
}

.fullscreen-icon{
    line-height:1;
    pointer-events:none;
}

/* Large laptops / monitors */
@media(min-width:1600px){
    .fullscreen-button{
        right:30px;
        bottom:30px;
        width:64px;
        height:64px;
        font-size:31px;
    }
}

/* Standard laptops */
@media(max-width:1400px){
    .fullscreen-button{
        right:20px;
        bottom:20px;
        width:56px;
        height:56px;
        font-size:27px;
    }
}

/* Tablets / smaller laptops */
@media(max-width:900px){
    .fullscreen-button{
        right:18px;
        bottom:18px;
        width:52px;
        height:52px;
        font-size:25px;
    }
}

/* Phones */
@media(max-width:600px){
    .fullscreen-button{
        right:14px;
        bottom:14px;
        width:48px;
        height:48px;
        font-size:22px;
        box-shadow:
            0 4px 0 #4c159e,
            0 6px 14px rgba(75,31,155,.24);

}

/* Very small phones */
@media(max-width:380px){
    .fullscreen-button{
        right:10px;
        bottom:10px;
        width:44px;
        height:44px;
        font-size:20px;
    }
}

/* When browser/device is in fullscreen */
:fullscreen .fullscreen-button{
    right:24px;
    bottom:24px;
}

@media(max-width:600px){
    :fullscreen .fullscreen-button{
        right:12px;
        bottom:12px;
    }
}

<script>

/* =========================================================
   5 QUESTIONS
   One question is displayed at a time.
========================================================= */

const quizData = [
      {
        questionBefore:
            "Eyes, ears, nose, tongue and skin are called the",

        questionAfter:
            ".",

        answer:
            "SENSEORGANS",

        image:
            "images/sense-organs.jpg"
    },

    {
        questionBefore:
            "Each part of our body has different",

        questionAfter:
            "to perform.",

        answer:
            "FUNCTIONS",

        image:
            "images/body-functions.jpg"
    },

    {
        questionBefore:
            "We must wipe our body with a clean",

        questionAfter:
            ".",

        answer:
            "TOWEL",

        image:
            "images/body-clean.jpg"
    },

  

    {
        questionBefore:
            "The",

        questionAfter:
            "is the sense organ that helps us to taste.",

        answer:
            "TONGUE",

        image:
            "images/tongue.jpg"
    },

    {
        questionBefore:
            "We must oil and comb our",

        questionAfter:
            "daily.",

        answer:
            "HAIR",

        image:
            "images/hair.jpg"
    }

];

/* =========================================================
   OPTIONAL RANDOM IMAGE PATHS
   If you want different images each time, add paths here.
   One image is selected for each question on load.
========================================================= */

const randomImagePaths = [

    "images/body-functions.jpg",
    "images/body-clean.jpg",
    "images/sense-organs.jpg",
    "images/tongue.jpg",
    "images/hair.jpg",

    "assets/images/question1.jpg",
    "assets/images/question2.jpg",
    "assets/images/question3.jpg",
    "assets/images/question4.jpg",
    "assets/images/question5.jpg"
];

/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

let currentAnswer = [];

let completed =
    new Array(quizData.length).fill(false);

/*
   Save each question's answer so Previous
   does not destroy the user's completed answer.
*/
let savedAnswers =
    quizData.map(() => []);

/* =========================================================
   ELEMENTS
========================================================= */

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const questionImage =
    document.getElementById(
        "questionImage"
    );

const lettersContainer =
    document.getElementById(
        "lettersContainer"
    );

const previousButton =
    document.getElementById(
        "previousButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const answerPopup =
    document.getElementById(
        "answerPopup"
    );

const finalPopup =
    document.getElementById(
        "finalPopup"
    );

const finalMessage =
    document.getElementById(
        "finalMessage"
    );

const playAgain =
    document.getElementById(
        "playAgain"
    );

/* =========================================================
   RANDOM IMAGE
========================================================= */

function getRandomImage(){

    const index =
        Math.floor(
            Math.random() *
            randomImagePaths.length
        );

    return randomImagePaths[index];
}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];
    }

    return copy;
}

/* =========================================================
   EMOJI POPUP
========================================================= */

function showAnswerPopup(correct){

    answerPopup.textContent =
        correct ? "😊" : "😢";

    answerPopup.classList.remove(
        "show"
    );

    void answerPopup.offsetWidth;

    answerPopup.classList.add(
        "show"
    );
}

/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    const data =
        quizData[currentQuestion];

    /*
       Restore previous answer if user
       goes back.
    */
    currentAnswer =
        savedAnswers[currentQuestion].length
            ? [...savedAnswers[currentQuestion]]
            : new Array(
                data.answer.length
            ).fill("");

    questionNumber.textContent =
        currentQuestion + 1;

    /*
       Question image.
       First try the question's own path.
       Replace these paths with your real
       image paths.
    */
    questionImage.classList.add(
        "image-changing"
    );

    setTimeout(() => {

        questionImage.src =
            data.image;

        questionImage.classList.remove(
            "image-changing"
        );

    },150);

    /*
       If you want a random image path
       instead, use:
       questionImage.src = getRandomImage();
    */

    questionText.innerHTML = "";

    const line =
        document.createElement("div");

    line.className =
        "question-line";

    line.append(
        document.createTextNode(
            data.questionBefore + " "
        )
    );

    const answerArea =
        document.createElement("span");

    answerArea.className =
        "answer-area";

    answerArea.id =
        "answerArea";

    line.appendChild(
        answerArea
    );

    line.append(
        document.createTextNode(
            " " + data.questionAfter
        )
    );

    questionText.appendChild(
        line
    );

    createAnswerBoxes();

    if(completed[currentQuestion]){

        lettersContainer.innerHTML = "";

    }else{

        createLetterTiles();
    }

    previousButton.disabled =
        currentQuestion === 0;

    nextButton.disabled =
        !completed[currentQuestion];

}

/* =========================================================
   CREATE ANSWER BOXES
========================================================= */

function formatCompletedAnswer(answer){

    const value =
        String(answer || "").trim();

    /*
       Multi-word answers are displayed with a real space.
       Example:
       SENSEORGANS -> SENSE ORGANS
    */
    const spacedAnswers = {
        "SENSEORGANS": "SENSE ORGANS"
    };

    return spacedAnswers[value.toUpperCase()] || value;
}

function createAnswerBoxes(){

    const area =
        document.getElementById("answerArea");

    const answer =
        quizData[currentQuestion].answer;

    area.innerHTML = "";

    /*
       If this question was already completed,
       show the entire answer in ONE box.
    */
    if(completed[currentQuestion]){

        area.classList.add(
            "single-answer"
        );

        const completedBox =
            document.createElement("div");

        completedBox.className =
            "completed-answer-box";

        completedBox.textContent =
            formatCompletedAnswer(answer);

        area.appendChild(
            completedBox
        );

        return;
    }

    area.classList.remove(
        "single-answer"
    );

    /*
       Normal state:
       one box per letter.
    */
    answer.split("").forEach(
        (letter,index)=>{

            const box =
                document.createElement("div");

            box.className =
                "answer-box";

            box.dataset.index =
                index;

            if(currentAnswer[index]){

                box.textContent =
                    currentAnswer[index];

                box.classList.add(
                    "filled"
                );
            }

            box.addEventListener(
                "dragover",
                event => {

                    event.preventDefault();

                    box.classList.add(
                        "drag-over"
                    );
                }
            );

            box.addEventListener(
                "dragleave",
                () => {

                    box.classList.remove(
                        "drag-over"
                    );
                }
            );

            box.addEventListener(
                "drop",
                event => {

                    event.preventDefault();

                    box.classList.remove(
                        "drag-over"
                    );

                    const letter =
                        event.dataTransfer
                            .getData("text/plain");

                    const tile =
                        document.querySelector(
                            `.letter-tile[data-letter="${letter}"]:not(.used)`
                        );

                    if(tile){

                        placeLetter(
                            letter,
                            index,
                            tile
                        );
                    }
                }
            );

            area.appendChild(
                box
            );
        }
    );
}

/* =========================================================
   CREATE LETTER TILES
========================================================= */

function createLetterTiles(){

    lettersContainer.innerHTML = "";

    const answer =
        quizData[currentQuestion].answer;

    /*
       Shuffle the answer letters.
    */
    const letters =
        shuffle(
            answer.split("")
        );

    /*
       Determine which copies of a letter
       have already been used.
    */
    const usedCount = {};

    currentAnswer.forEach(letter => {

        if(letter){

            usedCount[letter] =
                (usedCount[letter] || 0) + 1;
        }
    });

    const tileUsedCount = {};

    letters.forEach(
        (letter,index)=>{

            const tile =
                document.createElement(
                    "div"
                );

            tile.className =
                "letter-tile";

            tile.textContent =
                letter;

            tile.draggable =
                true;

            tile.dataset.letter =
                letter;

            /*
               Restore used tile state.
            */
            tileUsedCount[letter] =
                (tileUsedCount[letter] || 0);

            if(
                tileUsedCount[letter] <
                (usedCount[letter] || 0)
            ){

                tile.classList.add(
                    "used"
                );

                tileUsedCount[letter]++;
            }

            /* Drag */
            tile.addEventListener(
                "dragstart",
                event => {

                    if(
                        tile.classList.contains(
                            "used"
                        )
                    ){

                        event.preventDefault();

                        return;
                    }

                    event.dataTransfer.setData(
                        "text/plain",
                        letter
                    );
                }
            );

            /* Click support */
            tile.addEventListener(
                "click",
                () => {

                    if(
                        tile.classList.contains(
                            "used"
                        )
                    ){
                        return;
                    }

                    const emptyIndex =
                        currentAnswer.indexOf(
                            ""
                        );

                    if(
                        emptyIndex !== -1
                    ){

                        placeLetter(
                            letter,
                            emptyIndex,
                            tile
                        );
                    }
                }
            );

            lettersContainer.appendChild(
                tile
            );

        }
    );
}

/* =========================================================
   PLACE LETTER
========================================================= */

function placeLetter(
    letter,
    index,
    tile
){

    if(completed[currentQuestion]){
        return;
    }



    const answer =
        quizData[currentQuestion].answer;

    /*
       Don't replace an already filled box.
    */
    if(
        currentAnswer[index] !== ""
    ){
        return;
    }

    /*
       Wrong letter.
    */
    if(
        letter !== answer[index]
    ){

        tile.classList.remove(
            "wrong"
        );

        void tile.offsetWidth;

        tile.classList.add(
            "wrong"
        );

        showAnswerPopup(
            false
        );

        return;
    }

    /*
       Correct letter.
    */
    currentAnswer[index] =
        letter;

    savedAnswers[currentQuestion] =
        [...currentAnswer];

    tile.classList.add(
        "used"
    );

    const box =
        document.querySelector(
            `.answer-box[data-index="${index}"]`
        );

    box.textContent =
        letter;

    box.classList.add(
        "filled"
    );

    checkComplete();

}

/* =========================================================
   CHECK COMPLETE
========================================================= */

function checkComplete(){

    const answer =
        quizData[currentQuestion].answer;

    const isComplete =
        currentAnswer.join("") === answer;

    if(!isComplete){
        return;
    }

    completed[currentQuestion] =
        true;

    savedAnswers[currentQuestion] =
        [...currentAnswer];

    /*
       IMPORTANT:
       Convert all letter boxes into ONE box
       containing the complete answer.
    */
    const answerArea =
        document.getElementById("answerArea");

    if(answerArea){

        answerArea.innerHTML = "";

        answerArea.classList.add(
            "single-answer"
        );

        const completedBox =
            document.createElement("div");

        completedBox.className =
            "completed-answer-box";

        completedBox.textContent =
            formatCompletedAnswer(answer);

        answerArea.appendChild(
            completedBox
        );
    }

    /*
       Remove letter tiles after the answer
       has been completed.
    */
    lettersContainer.innerHTML = "";

    showAnswerPopup(
        true
    );

    nextButton.disabled =
        false;
}

/* =========================================================
   NEXT BUTTON
========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if(
            !completed[currentQuestion]
        ){
            return;
        }

        /*
           Last question.
        */
        if(
            currentQuestion ===
            quizData.length - 1
        ){

            finalMessage.textContent =
                `You completed all ${quizData.length} questions!`;

            finalPopup.classList.add(
                "show"
            );

            return;
        }

        /*
           Go to next question.
        */
        currentQuestion++;

        loadQuestion();

    }
);

/* =========================================================
   PREVIOUS BUTTON
========================================================= */

previousButton.addEventListener(
    "click",
    () => {

        if(
            currentQuestion === 0
        ){
            return;
        }

        currentQuestion--;

        loadQuestion();

    }
);

/* =========================================================
   PLAY AGAIN
========================================================= */

playAgain.addEventListener(
    "click",
    () => {

        currentQuestion = 0;

        completed =
            new Array(
                quizData.length
            ).fill(false);

        savedAnswers =
            quizData.map(
                () => []
            );

        finalPopup.classList.remove(
            "show"
        );

        loadQuestion();

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

const fullscreenButton =
    document.getElementById("fullscreenButton");

const fullscreenIcon =
    document.getElementById("fullscreenIcon");

function updateFullscreenButton(){

    const isFullscreen =
        !!document.fullscreenElement;

    fullscreenIcon.textContent =
        isFullscreen ? "⛶" : "⛶";

    fullscreenButton.setAttribute(
        "aria-label",
        isFullscreen
            ? "Exit fullscreen"
            : "Enter fullscreen"
    );

    fullscreenButton.setAttribute(
        "title",
        isFullscreen
            ? "Exit Fullscreen"
            : "Fullscreen"
    );
}

fullscreenButton.addEventListener(
    "click",
    async () => {

        try{

            if(!document.fullscreenElement){

                await document.documentElement.requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            console.warn(
                "Fullscreen is not available:",
                error
            );
        }

        updateFullscreenButton();
    }
);

document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);

updateFullscreenButton();


/* =========================================================
   START QUIZ
========================================================= */

loadQuestion();

</script>
