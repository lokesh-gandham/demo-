<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bow Arrow Kids Quiz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:
        radial-gradient(circle at 12% 20%,rgba(255,255,255,.18) 0 4px,transparent 5px),
        radial-gradient(circle at 80% 25%,rgba(255,255,255,.16) 0 5px,transparent 6px),
        radial-gradient(circle at 60% 80%,rgba(255,255,255,.12) 0 4px,transparent 5px),
        linear-gradient(135deg,#65b9e5,#80cbed 50%,#5599c3);
}

.game{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =========================================================
   QUESTION HEADER
========================================================= */

.question-bar{
    position:absolute;
    z-index:100;

    top:4px;
    left:8px;
    right:8px;

    height:132px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 150px;

    background:
        linear-gradient(
            135deg,
            #304c62,
            #20384c
        );

    border-radius:
        0 0 48px 48px;

    box-shadow:
        0 12px 0 rgba(0,0,0,.16),
        0 18px 30px rgba(0,0,0,.12);
}

.question-number{
    position:absolute;

    left:24px;
    top:22px;

    width:82px;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #ffb21b,
            #ff8500
        );

    border:4px solid #ffbd27;

    color:#fff;

    font-size:25px;
    font-weight:900;

    box-shadow:
        0 8px 0 #d46b00,
        0 12px 18px rgba(0,0,0,.20);
}

.question-text{
    max-width:1100px;

    color:#fff;

    text-align:center;

    font-size:
        clamp(
            24px,
            3vw,
            46px
        );

    font-weight:900;

    line-height:1.15;

    text-shadow:
        0 4px 2px rgba(0,0,0,.18);

    animation:
        questionIn .55s ease;
}

@keyframes questionIn{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================================================
   SOUND
========================================================= */

.sound-button{
    position:absolute;

    right:24px;
    top:22px;

    width:82px;
    height:82px;

    border:4px solid #ffbd27;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #ffb21b,
            #ff8500
        );

    color:#fff;

    font-size:35px;

    cursor:pointer;

    box-shadow:
        0 8px 0 #d46b00,
        0 12px 18px rgba(0,0,0,.20);

    transition:
        transform .15s ease;
}

.sound-button:hover{
    transform:translateY(-3px);
}

.sound-button:active{
    transform:translateY(5px);
}

/* =========================================================
   SCORE
========================================================= */

.score-box{
    position:absolute;

    z-index:100;

    top:150px;
    right:25px;

    min-width:140px;
    height:50px;

    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    border-radius:28px;

    background:rgba(255,255,255,.94);

    border:4px solid #ffad16;

    color:#27485c;

    font-size:21px;
    font-weight:900;

    box-shadow:
        0 6px 0 rgba(0,0,0,.15);
}

/* =========================================================
   BOARD
========================================================= */

.board{
    position:absolute;

    left:0;
    right:0;

    top:136px;
    bottom:0;

    overflow:hidden;
}

/* =========================================================
   OPTIONS AREA
========================================================= */

.options-area{
    position:absolute;

    left:50%;
    top:115px;

    transform:translateX(-50%);

    width:min(94vw,1350px);

    height:430px;

    overflow:visible;
}

/* =========================================================
   OPTIONS
========================================================= */

.option{
    position:absolute;

    width:
        clamp(
            170px,
            14vw,
            225px
        );

    height:
        clamp(
            170px,
            14vw,
            225px
        );

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    border:
        8px solid
        rgba(255,255,255,.95);

    border-radius:50%;

    color:#fff;

    font-size:
        clamp(
            17px,
            1.5vw,
            26px
        );

    font-weight:900;

    line-height:1.12;

    text-align:center;

    text-shadow:
        0 3px 3px rgba(0,0,0,.30);

    cursor:pointer;

    user-select:none;

    z-index:30;

    box-shadow:
        0 12px 0 rgba(0,0,0,.18),
        0 18px 30px rgba(0,0,0,.18);

    transition:
        transform .2s ease,
        filter .2s ease;
}

/* Rainbow / dhanush arrangement */

.option-a{
    left:0;
    top:155px;

    background:
        linear-gradient(
            145deg,
            #ff6b9f,
            #e92768
        );
}

.option-b{
    left:26%;
    top:0;

    background:
        linear-gradient(
            145deg,
            #7d8cff,
            #5149d9
        );
}

.option-c{
    right:26%;
    top:0;

    background:
        linear-gradient(
            145deg,
            #42d8bd,
            #0fa98d
        );
}

.option-d{
    right:0;
    top:155px;

    background:
        linear-gradient(
            145deg,
            #ffb53d,
            #ed7712
        );
}

/* =========================================================
   OPTIONS FALL FROM TOP
========================================================= */

.option.drop-in{
    animation:
        optionDrop
        .95s
        cubic-bezier(.18,.89,.32,1.28)
        forwards;
}

.option-a.drop-in,
.option-d.drop-in{
    animation-delay:.18s;
}

.option-b.drop-in,
.option-c.drop-in{
    animation-delay:.03s;
}

@keyframes optionDrop{

    0%{
        opacity:0;

        transform:
            translateY(-500px)
            scale(.65)
            rotate(-12deg);
    }

    50%{
        opacity:1;

        transform:
            translateY(25px)
            scale(1.05)
            rotate(4deg);
    }

    75%{
        transform:
            translateY(-12px)
            scale(.98)
            rotate(-2deg);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1)
            rotate(0);
    }
}

/* =========================================================
   LETTER
========================================================= */

.option-letter{
    position:absolute;

    top:-22px;
    left:50%;

    width:58px;
    height:58px;

    transform:translateX(-50%);

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#fff;

    color:#334b5e;

    border:
        5px solid
        rgba(255,255,255,.85);

    font-size:25px;
    font-weight:900;

    box-shadow:
        0 6px 0 rgba(0,0,0,.18);

    z-index:40;
}

.option:hover{
    transform:
        scale(1.07)
        translateY(-5px);

    filter:brightness(1.08);
}

/* =========================================================
   CORRECT
========================================================= */

.option.locked{
    pointer-events:none !important;
    cursor:not-allowed !important;
    opacity:.42;
    filter:grayscale(.45);
    transform:none !important;
}

.option.correct{
    pointer-events:none;
    cursor:default;
    opacity:1 !important;
    filter:none !important;

    background:
        linear-gradient(
            145deg,
            #6af176,
            #1dbd4b
        ) !important;

    border-color:#dcffe1;

    box-shadow:
        0 0 0 10px rgba(70,255,120,.25),
        0 15px 0 #128d36,
        0 25px 40px rgba(0,0,0,.20);

    animation:
        correctBounce .8s ease;
}

@keyframes correctBounce{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.18);
    }

    55%{
        transform:scale(.96);
    }

    75%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================================================
   WRONG
========================================================= */

.option.wrong{

    background:
        linear-gradient(
            145deg,
            #ff6969,
            #d82424
        ) !important;

    animation:
        wrongShake .45s ease;
}

@keyframes wrongShake{

    0%,100%{
        transform:translateX(0);
    }

    20%{
        transform:
            translateX(-15px)
            rotate(-4deg);
    }

    40%{
        transform:
            translateX(15px)
            rotate(4deg);
    }

    60%{
        transform:
            translateX(-12px)
            rotate(-3deg);
    }

    80%{
        transform:
            translateX(10px)
            rotate(3deg);
    }
}

/* =========================================================
   BREAKING OPTION
========================================================= */

.option.breaking{
    pointer-events:none;

    animation:
        crackOption .3s ease forwards;
}

@keyframes crackOption{

    0%{
        transform:scale(1);
    }

    40%{
        transform:
            scale(1.08)
            rotate(-3deg);
    }

    70%{
        transform:
            scale(1.12)
            rotate(3deg);
    }

    100%{
        transform:
            scale(.9);

        opacity:.15;
    }
}

/* =========================================================
   BROKEN PIECES
========================================================= */

.break-piece{

    position:absolute;

    width:25px;
    height:25px;

    border-radius:5px;

    pointer-events:none;

    z-index:350;

    box-shadow:
        0 4px 8px rgba(0,0,0,.25);

    animation:
        pieceFly
        .85s
        cubic-bezier(.2,.8,.3,1)
        forwards;
}

@keyframes pieceFly{

    0%{
        opacity:1;

        transform:
            translate(0,0)
            rotate(0)
            scale(1);
    }

    40%{
        opacity:1;

        transform:
            translate(
                calc(var(--tx) * .45),
                calc(var(--ty) * .45)
            )
            rotate(
                calc(var(--r) * .5)
            )
            scale(1.08);
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--tx),
                var(--ty)
            )
            rotate(var(--r))
            scale(.1);
    }
}

/* =========================================================
   BOW
   FACING UP
========================================================= */

.bow{

    position:absolute;

    left:50%;

    bottom:70px;

    width:190px;
    height:190px;

    transform:
        translateX(-50%);

    z-index:180;

    pointer-events:none;
}

/*
        BOW FACES UP

              ╭─────────╮
             /           \
            /             \
           /      │        \
          /       │         \
                  │
                  │
                 ARROW
*/

.bow-curve{

    position:absolute;

    left:50%;
    top:30px;

    width:155px;
    height:125px;

    transform:
        translateX(-50%);

    border-top:
        15px solid #713510;

    border-left:
        15px solid #713510;

    border-right:
        15px solid #713510;

    border-bottom:0;

    border-radius:
        85px 85px 0 0;

    filter:
        drop-shadow(
            0 6px 3px
            rgba(0,0,0,.30)
        );
}

/* Bow highlight */

.bow-curve::before{

    content:"";

    position:absolute;

    left:12px;
    right:12px;
    top:4px;

    height:7px;

    border-radius:20px;

    background:#d8893b;
}

/* =========================================================
   BOW GRIP
========================================================= */

.bow-grip{

    position:absolute;

    left:50%;
    top:85px;

    width:27px;
    height:65px;

    transform:
        translateX(-50%);

    border-radius:12px;

    background:
        linear-gradient(
            90deg,
            #6b300e,
            #ca772c,
            #6b300e
        );

    box-shadow:
        0 5px 5px rgba(0,0,0,.25);

    z-index:10;
}

/* =========================================================
   BOW STRING
========================================================= */

.bow-string{

    position:absolute;

    left:50%;
    top:30px;

    width:3px;
    height:125px;

    transform:
        translateX(-50%);

    background:#f8e6c5;

    box-shadow:
        0 0 4px rgba(0,0,0,.45);

    z-index:15;
}

/* =========================================================
   ARROW
========================================================= */

.arrow{
    position:absolute;
    left:0;
    top:0;
    width:16px;
    height:185px;
    transform:translate(-50%,0) rotate(0deg);
    transform-origin:50% 0%;
    z-index:450;
    pointer-events:none;
    opacity:1;
    will-change:left,top,transform,height;
}

/* =========================================================
   ARROW SHAFT
========================================================= */

.arrow-shaft{

    position:absolute;

    left:4px;
    top:22px;

    width:8px;
    height:calc(100% - 22px);

    border-radius:8px;

    background:
        linear-gradient(
            180deg,
            #683415,
            #d99a52,
            #683415
        );

    box-shadow:
        0 2px 3px rgba(0,0,0,.30);
}

/* =========================================================
   ARROW HEAD
========================================================= */

.arrow-head{

    position:absolute;

    left:-3px;
    top:-5px;

    width:0;
    height:0;

    border-left:
        11px solid transparent;

    border-right:
        11px solid transparent;

    border-bottom:
        30px solid #e4e7eb;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(0,0,0,.35)
        );
}

/* =========================================================
   ARROW FEATHERS
========================================================= */

.arrow-feather-one,
.arrow-feather-two{

    position:absolute;

    left:-4px;

    width:19px;
    height:28px;

    background:#e74d53;

    clip-path:
        polygon(
            0 0,
            100% 50%,
            0 100%
        );
}

.arrow-feather-one{
    bottom:6px;

    transform:
        rotate(20deg);
}

.arrow-feather-two{
    bottom:6px;

    transform:
        rotate(-200deg);
}

/* =========================================================
   ARROW HIT EFFECT
========================================================= */

.arrow-hit{

    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    border:5px solid #fff700;

    pointer-events:none;

    z-index:500;

    animation:
        hitEffect .45s ease-out forwards;
}

@keyframes hitEffect{

    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(3);
    }
}

/* =========================================================
   FEEDBACK
========================================================= */

.feedback{

    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%)
        scale(.4);

    z-index:600;

    opacity:0;

    pointer-events:none;

    font-size:
        clamp(
            40px,
            6vw,
            85px
        );

    font-weight:900;

    text-shadow:
        0 6px 12px
        rgba(0,0,0,.25);
}

.feedback.correct{
    color:#4dff6b;
}

.feedback.wrong{
    color:#ff3f3f;
}

.feedback.show{

    animation:
        feedbackShow
        .9s
        ease-out
        forwards;
}

@keyframes feedbackShow{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.4);
    }

    25%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    55%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-70%)
            scale(1);
    }
}

/* =========================================================
   PARTICLES
========================================================= */

.particle{

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    pointer-events:none;

    z-index:550;

    animation:
        particleFly .7s ease-out forwards;
}

@keyframes particleFly{

    0%{
        opacity:1;

        transform:
            translate(0,0)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.1);
    }
}

/* =========================================================
   PROGRESS BUTTON — BOTTOM LEFT
========================================================= */
.navigation{
    position:absolute;
    z-index:700;
    left:18px;
    bottom:12px;
}
.progress-button{
    min-width:190px;
    height:58px;
    padding:0 22px;
    border:0;
    border-radius:22px;
    color:#fff;
    background:linear-gradient(145deg,#7e91a1,#526b7d);
    font-family:inherit;
    font-size:21px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 0 rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.15);
    transition:transform .15s ease,filter .15s ease;
}
.progress-button:hover{transform:translateY(-4px);filter:brightness(1.08);}
.progress-button:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18);}

/* Progress popup */
.progress-popup-overlay{
    position:fixed;
    inset:0;
    z-index:2500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.58);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .25s ease,visibility .25s ease;
}
.progress-popup-overlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}
.progress-popup{
    position:relative;
    width:min(650px,92vw);
    max-height:80vh;
    overflow:hidden;
    padding:34px 25px 24px;
    border:8px solid #a94722;
    border-radius:24px;
    background:linear-gradient(145deg,#102e12,#173b16);
    color:#fff;
    box-shadow:0 18px 45px rgba(0,0,0,.45);
    transform:scale(.82);
    transition:transform .3s ease;
}
.progress-popup-overlay.show .progress-popup{transform:scale(1);}
.progress-close{
    position:absolute;
    top:8px;
    right:10px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#ef4f4f;
    color:#fff;
    font-size:27px;
    font-weight:900;
    cursor:pointer;
}
.progress-title{
    text-align:center;
    font-size:clamp(24px,3vw,36px);
    font-weight:900;
}
.progress-total{
    width:max-content;
    margin:10px auto 18px;
    padding:7px 18px;
    border-radius:20px;
    background:#28a84a;
    font-size:20px;
    font-weight:900;
}
.progress-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    max-height:55vh;
    overflow-y:auto;
}
.progress-item{
    display:grid;
    grid-template-columns:42px 1fr;
    gap:10px;
    align-items:center;
    padding:10px;
    border:2px solid rgba(75,214,107,.55);
    border-radius:13px;
    background:rgba(75,214,107,.12);
}
.progress-number{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#28a84a;
    font-weight:900;
}
.progress-question{
    font-size:16px;
    line-height:1.25;
    font-weight:800;
}
.progress-answer{
    display:block;
    margin-top:3px;
    color:#8dff9c;
}
.progress-empty{
    padding:25px 10px;
    text-align:center;
    font-size:16px;
    line-height:1.4;
}

/* =========================================================
   FULLSCREEN
========================================================= */

.fullscreen{

    position:absolute;

    z-index:450;

    right:24px;
    bottom:12px;

    width:62px;
    height:62px;

    border:0;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #ffb21b,
            #ff8500
        );

    color:white;

    font-size:30px;

    cursor:pointer;

    box-shadow:
        0 7px 0 #d46b00;
}

.fullscreen:hover{
    transform:translateY(-3px);
}

.fullscreen:active{
    transform:translateY(4px);
}

/* =========================================================
   1600+
========================================================= */

@media (min-width:1600px){

    .question-bar{
        height:140px;
    }

    .board{
        top:144px;
    }

    .options-area{
        top:120px;
        width:min(90vw,1450px);
    }

    .option{
        width:235px;
        height:235px;
    }

    .option-a,
    .option-d{
        top:175px;
    }

    .bow{
        bottom:70px;

        transform:
            translateX(-50%)
            scale(1.05);
    }
}

/* =========================================================
   1200 - 1599
========================================================= */

@media
(min-width:1200px)
and
(max-width:1599px){

    .options-area{
        width:92vw;
    }

    .option{
        width:210px;
        height:210px;
    }

    .option-a,
    .option-d{
        top:155px;
    }

    .bow{
        bottom:65px;

        transform:
            translateX(-50%)
            scale(.92);
    }
}

/* =========================================================
   992 - 1199
========================================================= */

@media (max-width:1199px){

    .question-bar{
        height:120px;
        padding:0 120px;
    }

    .question-number,
    .sound-button{
        width:70px;
        height:70px;
    }

    .question-number{
        left:18px;
        top:20px;
        font-size:22px;
    }

    .sound-button{
        right:18px;
        top:20px;
        font-size:29px;
    }

    .board{
        top:125px;
    }

    .options-area{
        top:50px;
        width:94vw;
    }

    .option{
        width:180px;
        height:180px;
    }

    .option-a,
    .option-d{
        top:135px;
    }

    .option-letter{
        width:50px;
        height:50px;
        font-size:22px;
    }

    .score-box{
        top:135px;

/* =========================================================
   MOVING WATER BALLOONS - BACKGROUND
   Five different sizes, soft blue water-balloon effect.
   They stay behind the quiz UI and never block clicks.
========================================================= */

.water-balloons-bg{
    position:absolute;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
}

.water-balloon{
    position:absolute;
    display:block;
    width:clamp(42px,4vw,78px);
    height:clamp(55px,5.2vw,96px);
    border-radius:52% 48% 48% 52% / 48% 48% 56% 52%;
    background:
        radial-gradient(circle at 30% 23%, rgba(255,255,255,.88) 0 7%, rgba(255,255,255,.25) 8% 15%, transparent 16%),
        radial-gradient(circle at 64% 72%, rgba(16,111,190,.22) 0 18%, transparent 19%),
        linear-gradient(145deg, rgba(151,231,255,.94), rgba(37,153,220,.88) 58%, rgba(17,103,180,.92));
    border:2px solid rgba(255,255,255,.72);
    box-shadow:
        inset -10px -13px 18px rgba(0,69,130,.20),
        inset 8px 7px 13px rgba(255,255,255,.30),
        0 10px 22px rgba(0,73,130,.16);
    opacity:.58;
    filter:saturate(1.08);
    will-change:transform;
}

/* little tied neck */
.water-balloon::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:-8px;
    width:14px;
    height:13px;
    transform:translateX(-50%) rotate(2deg);
    background:linear-gradient(135deg,#48b9ea,#1678bc);
    clip-path:polygon(18% 0,82% 0,100% 48%,64% 100%,36% 100%,0 48%);
    filter:drop-shadow(0 2px 2px rgba(0,60,110,.18));
}

/* tiny highlight */
.water-balloon::after{
    content:"";
    position:absolute;
    left:18%;
    top:14%;
    width:20%;
    height:27%;
    border-radius:50%;
    background:rgba(255,255,255,.72);
    transform:rotate(22deg);
}

/* Large */
.water-balloon.b1{
    width:clamp(64px,6vw,112px);
    height:clamp(82px,7.5vw,136px);
    left:5%;
    top:20%;
    animation:waterBalloon1 15s ease-in-out infinite;
}

/* Small */
.water-balloon.b2{
    width:clamp(35px,3vw,60px);
    height:clamp(46px,4vw,76px);
    left:28%;
    top:68%;
    opacity:.45;
    animation:waterBalloon2 11s ease-in-out infinite;
}

/* Medium */
.water-balloon.b3{
    width:clamp(50px,4.5vw,84px);
    height:clamp(64px,5.8vw,102px);
    left:52%;
    top:23%;
    opacity:.52;
    animation:waterBalloon3 14s ease-in-out infinite;
}

/* Small */
.water-balloon.b4{
    width:clamp(38px,3.4vw,68px);
    height:clamp(49px,4.5vw,84px);
    left:76%;
    top:67%;
    opacity:.42;
    animation:waterBalloon4 12s ease-in-out infinite;
}

/* Big */
.water-balloon.b5{
    width:clamp(58px,5.4vw,100px);
    height:clamp(74px,6.8vw,122px);
    left:89%;
    top:28%;
    opacity:.50;
    animation:waterBalloon5 16s ease-in-out infinite;
}

@keyframes waterBalloon1{
    0%,100%{ transform:translate3d(0,0,0) rotate(-7deg); }
    25%{ transform:translate3d(95px,-55px,0) rotate(8deg); }
    50%{ transform:translate3d(170px,30px,0) rotate(-3deg); }
    75%{ transform:translate3d(65px,95px,0) rotate(10deg); }
}

@keyframes waterBalloon2{
    0%,100%{ transform:translate3d(0,0,0) rotate(8deg); }
    25%{ transform:translate3d(-75px,-35px,0) rotate(-8deg); }
    50%{ transform:translate3d(-140px,22px,0) rotate(5deg); }
    75%{ transform:translate3d(-55px,72px,0) rotate(-10deg); }
}

@keyframes waterBalloon3{
    0%,100%{ transform:translate3d(0,0,0) rotate(-4deg); }
    25%{ transform:translate3d(-115px,55px,0) rotate(9deg); }
    50%{ transform:translate3d(70px,105px,0) rotate(-7deg); }
    75%{ transform:translate3d(135px,-35px,0) rotate(6deg); }
}

@keyframes waterBalloon4{
    0%,100%{ transform:translate3d(0,0,0) rotate(7deg); }
    30%{ transform:translate3d(80px,-70px,0) rotate(-8deg); }
    60%{ transform:translate3d(-60px,-125px,0) rotate(9deg); }
    85%{ transform:translate3d(-115px,20px,0) rotate(-5deg); }
}

@keyframes waterBalloon5{
    0%,100%{ transform:translate3d(0,0,0) rotate(-8deg); }
    25%{ transform:translate3d(-90px,75px,0) rotate(6deg); }
    50%{ transform:translate3d(-190px,15px,0) rotate(-4deg); }
    75%{ transform:translate3d(-105px,-85px,0) rotate(8deg); }
}

/* Keep balloons subtle on smaller screens */
@media (max-width:768px){
    .water-balloon{ opacity:.34; }
    .water-balloon.b1,

        width:56px;

    }
}

    }

/* =========================================================
   FINAL BLACKBOARD POPUP
========================================================= */

.final-popup{
    position:fixed;
    inset:0;
    z-index:2000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .25s ease, visibility .25s ease;
    
    
}

.final-popup.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.final-board{
    position:relative;
    width:min(650px,88vw);
    min-height:360px;
    padding:45px 35px 32px;
    background:
        radial-gradient(circle at 20% 18%,rgba(255,255,255,.035) 0 2px,transparent 3px),
        radial-gradient(circle at 75% 70%,rgba(255,255,255,.025) 0 2px,transparent 3px),
        linear-gradient(145deg,#202820,#111811 55%,#182018);
    border:2px solid rgba(255,255,255,.82);
    border-radius:7px;
    box-shadow:
        0 12px 35px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(255,255,255,.08),
        inset 0 0 35px rgba(0,0,0,.32);
    color:#fff;
    text-align:center;
    transform:scale(.88) translateY(20px);
    transition:transform .3s ease;

     width:100%;

    min-height:
        clamp(
            400px,
            58vh,
            680px
        );

    padding:
        clamp(30px,4vw,60px);

    background:
        linear-gradient(
            145deg,
            #102e12,
            #173b16
        );

    border:
        clamp(10px,1.1vw,18px)
        solid
        #a94722;

    border-radius:8px;

    box-shadow:

        inset
        0 0 0 4px
        rgba(255,255,255,.05),

        0 12px 0
        rgba(0,0,0,.18),

        0 18px 30px
        rgba(0,0,0,.25);

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.final-popup.show .final-board{
    transform:scale(1) translateY(0);
}

.final-board::before,
.final-board::after{
    content:"";
    position:absolute;
    height:1px;
    left:24px;
    right:24px;
    background:rgba(255,255,255,.45);
}

.final-board::before{top:18px;}
.final-board::after{bottom:18px;}

.final-title{
    margin:0 0 18px;
    color:#fff;
    font-size:clamp(34px,5vw,58px);
    line-height:1.1;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:0 2px 3px rgba(0,0,0,.6);
}

.final-trophy{
    font-size:clamp(45px,6vw,70px);
    margin-bottom:8px;
    line-height:1;
}

.final-message{
    margin:0 auto 18px;
    color:#fff;
    font-size:clamp(17px,2.2vw,25px);
    line-height:1.4;
    font-weight:700;
}

.final-score{
    display:inline-block;
    padding:9px 22px;
    border:1px solid rgba(255,255,255,.75);
    border-radius:4px;
    color:#fff;
    font-size:clamp(20px,3vw,30px);
    font-weight:900;
    letter-spacing:.5px;
    background:rgba(255,255,255,.04);
}

.play-again-button{
    display:block;

/* =========================================================
   SMALL CONFETTI AFTER EVERY CORRECT ANSWER
========================================================= */

.small-confetti{
    position:absolute;
    width:9px;
    height:14px;
    border-radius:3px;
    pointer-events:none;
    z-index:560;
    animation:smallConfettiFly .85s cubic-bezier(.2,.8,.3,1) forwards;
    transform:translate(-50%,-50%);
}

@keyframes smallConfettiFly{
    0%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            translate(0,0)
            rotate(0deg)
            scale(1);
    }
    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            translate(var(--cx),var(--cy))
            rotate(var(--cr))
            scale(.65);
    }
}

/* =========================================================
   BIG CONFETTI FOR FINAL RESULT
========================================================= */

.final-confetti{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:2100;
}

.final-confetti-piece{
    position:absolute;
    top:-40px;
    width:12px;
    height:22px;
    border-radius:3px;
    opacity:0;
    animation:finalConfettiFall var(--fall-time) cubic-bezier(.15,.75,.25,1) forwards;
    animation-delay:var(--delay);
}

@keyframes finalConfettiFall{
    0%{
        opacity:1;
        transform:
            translate3d(0,0,0)
            rotate(0deg)
            scale(1);
    }
    70%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:
            translate3d(var(--fall-x),110vh,0)
            rotate(var(--rotate))
            scale(.75);
    }
}

<script>

/* =========================================================
   QUIZ DATA
========================================================= */

const quizData = [

    {
        question:
            "Each part of our body has different ______ to perform.",

        options:[
            "functions",
            "parts",
            "shapes",
            "colors",
            "names"
        ],

        answer:"A"
    },

    {
        question:
            "We must wipe our body with a clean ______.",

        options:[
            "soap",
            "towel",
            "brush",
            "water",
            "cloth"
        ],

        answer:"B"
    },

    {
        question:
            "Eyes, ears, nose, tongue and skin are called the ______.",

        options:[
            "body parts",
            "limbs",
            "sense organs",
            "muscles",
            "bones"
        ],

        answer:"C"
    },

    {
        question:
            "The ______ is the sense organ that helps us to taste.",

        options:[
            "eyes",
            "ears",
            "nose",
            "tongue",
            "skin"
        ],

        answer:"D"
    },

    {
        question:
            "We must oil and comb our ______ daily.",

        options:[
            "teeth",
            "nails",
            "hands",
            "feet",
            "hair"
        ],

        answer:"E"
    }

];


/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

let score = 0;

let moving = false;

let soundEnabled = true;

let audioContext = null;

const completed =
    new Array(
        quizData.length
    ).fill(false);


/* =========================================================
   ELEMENTS
========================================================= */

const optionsArea =
    document.getElementById(
        "optionsArea"
    );

const bow =
    document.getElementById(
        "bow"
    );

const arrow =
    document.getElementById(
        "arrow"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const questionNo =
    document.getElementById(
        "questionNo"
    );

const scoreEl =
    document.getElementById(
        "score"
    );

const feedback =
    document.getElementById(
        "feedback"
    );

/* PREV/NEXT buttons removed. Kept as harmless compatibility objects
   because older completion/reset code still references them. */
const nextButton = { disabled:true };
const prevButton = { disabled:true };

const soundButton =
    document.getElementById(
        "soundButton"
    );


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }
}


function playTone(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    if(!soundEnabled)
        return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );
}


function clickSound(){

    playTone(
        420,
        .08,
        "sine",
        .05
    );
}


function shootSound(){

    if(!soundEnabled)
        return;

    playTone(
        450,
        .07,
        "triangle",
        .06
    );

    setTimeout(
        () => {

            playTone(
                750,
                .08,
                "triangle",
                .05
            );

        },
        60
    );
}


function correctSound(){

    playTone(
        600,
        .15,
        "sine",
        .10
    );

    setTimeout(
        () => {

            playTone(
                850,
                .18,
                "sine",
                .09
            );

        },
        100
    );

    setTimeout(
        () => {

            playTone(
                1100,
                .25,
                "sine",
                .10
            );

        },
        200
    );
}


function wrongSound(){

    playTone(
        180,
        .25,
        "sawtooth",
        .08
    );

    setTimeout(
        () => {

            playTone(
                100,
                .30,
                "sawtooth",
                .06
            );

        },
        100
    );
}


/* =========================================================
   CREATE OPTIONS
========================================================= */

function createOptions(){

    optionsArea.innerHTML = "";

    const question =
        quizData[
            currentQuestion
        ];

    const letters = [
        "A",
        "B",
        "C",
        "D",
        "E"
    ];

    letters.forEach(
        (letter,index) => {

            const option =
                document.createElement(
                    "button"
                );

            option.type = "button";

            option.className =
                "option option-" +
                letter.toLowerCase() +
                " drop-in";

            option.dataset.option =
                letter;

            option.innerHTML = `
                <span class="option-letter">
                    ${letter}
                </span>

                <span class="option-text">
                    ${question.options[index]}
                </span>
            `;

            option.addEventListener(
                "click",
                () => {
                    selectOption(option);
                }
            );

            optionsArea.appendChild(
                option
            );
        }
    );
}



/* =========================================================
   PROGRESS BUTTON
========================================================= */
const progressButton =
    document.getElementById("progressButton");

const progressText =
    document.getElementById("progressText");

const progressPopup =
    document.getElementById("progressPopup");

const progressClose =
    document.getElementById("progressClose");

const progressTotal =
    document.getElementById("progressTotal");

const progressList =
    document.getElementById("progressList");

function updateProgressUI(){

    const solved =
        completed.filter(Boolean).length;

    const total =
        quizData.length;

    /* Button count */
    if(progressText){
        progressText.textContent =
            solved + " / " + total;
    }

    /* Popup count */
    if(progressTotal){
        progressTotal.textContent =
            solved + " / " + total;
    }

    if(!progressList){
        return;
    }

    const solvedQuestions =
        quizData
            .map((question,index) => ({
                question,
                index
            }))
            .filter(item => completed[item.index]);

    if(!solvedQuestions.length){

        progressList.innerHTML =
            '<div class="progress-empty">' +
            'Answer questions correctly to see your progress.' +
            '</div>';

        return;
    }

    progressList.innerHTML =
        solvedQuestions.map(item => {

            const question = item.question;

            /*
             * quizData.answer stores A/B/C/D.
             * Convert that letter to the actual option text.
             */
            const answerIndex =
                String(question.answer || "")
                    .trim()
                    .toUpperCase()
                    .charCodeAt(0) - 65;

            const answerText =
                answerIndex >= 0 &&
                answerIndex < question.options.length
                    ? question.options[answerIndex]
                    : question.answer;

            return `
                <div class="progress-item">
                    <div class="progress-number">
                        ${item.index + 1}
                    </div>

                    <div class="progress-question">
                        ${question.question}

                        <span class="progress-answer">
                            ✓ ${answerText}
                        </span>
                    </div>
                </div>
            `;

        }).join("");
}

function openProgress(){

    updateProgressUI();

    if(progressPopup){
        progressPopup.classList.add("show");
        progressPopup.setAttribute(
            "aria-hidden",
            "false"
        );
    }
}

function closeProgress(){

    if(progressPopup){
        progressPopup.classList.remove("show");
        progressPopup.setAttribute(
            "aria-hidden",
            "true"
        );
    }
}

if(progressButton){
    progressButton.addEventListener(
        "click",
        openProgress
    );
}

if(progressClose){
    progressClose.addEventListener(
        "click",
        closeProgress
    );
}

if(progressPopup){
    progressPopup.addEventListener(
        "click",
        event => {
            if(event.target === progressPopup){
                closeProgress();
            }
        }
    );
}

document.addEventListener(
    "keydown",
    event => {
        if(
            event.key === "Escape" &&
            progressPopup &&
            progressPopup.classList.contains("show")
        ){
            closeProgress();
        }
    }
);


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    moving = false;
    updateProgressUI();

    resetArrow();

    feedback.className =
        "feedback";

    feedback.textContent =
        "";


    const question =
        quizData[
            currentQuestion
        ];


    questionNo.textContent =
        currentQuestion + 1;


    questionText.innerHTML =
        question.question.replace(
            "______",
            '<span class="blank-slot">______</span>'
        );


    createOptions();


    prevButton.disabled =
        currentQuestion === 0;


    /*
       NEXT is locked until the CURRENT question has been
       answered correctly.
       Example:
       Q1 correct -> enable Next for Q2
       Q2 correct -> enable Next for Q3
       Q3 correct -> enable Next for Q4
       Q4 correct -> enable Next for Q5
       Q5 correct -> enable Next to show the final result
    */
    nextButton.disabled =
        !completed[currentQuestion];


    if(
        completed[
            currentQuestion
        ]
    ){

        setTimeout(
            () => {

                showCompletedQuestion();

            },
            1000
        );

    }
}


/* =========================================================
   OPTION SELECT
========================================================= */

function selectOption(option){

    if(moving)
        return;


    if(
        completed[
            currentQuestion
        ]
    ){

        return;
    }


    moving = true;

    initAudio();

    clickSound();


    /*
       Arrow now physically travels
       to the clicked option.
    */

    shootArrowToOption(
        option
    );
}


/* =========================================================
   RESET ARROW
========================================================= */

function resetArrow(){

    const board = document.querySelector(".board");
    const boardRect = board.getBoundingClientRect();
    const bowRect = bow.getBoundingClientRect();

    const x =
        bowRect.left - boardRect.left + bowRect.width / 2;

    const y =
        bowRect.top - boardRect.top + 4;

    arrow.style.left = x + "px";
    arrow.style.top = y + "px";
    arrow.style.width = "16px";
    arrow.style.height = "185px";
    arrow.style.transform =
        "translate(-50%,0) rotate(0deg)";
    arrow.style.opacity = "1";
}

/* =========================================================
   SHOOT ARROW TO EXACT CLICKED OPTION
========================================================= */

function shootArrowToOption(option){

    shootSound();

    const board = document.querySelector(".board");
    const boardRect = board.getBoundingClientRect();
    const bowRect = bow.getBoundingClientRect();
    const optionRect = option.getBoundingClientRect();

    /*
       IMPORTANT:
       The arrow is now a direct child of .board.
       Therefore these coordinates are truly board-relative
       on every screen size. The old version had the arrow
       inside the scaled .bow, which caused the offset.
    */

    const startX =
        bowRect.left - boardRect.left + bowRect.width / 2;

    const startY =
        bowRect.top - boardRect.top + 4;

    /* Exact CENTER of the option that was clicked. */
    const targetX =
        optionRect.left - boardRect.left + optionRect.width / 2;

    const targetY =
        optionRect.top - boardRect.top + optionRect.height / 2;

    const dx = targetX - startX;
    const dy = targetY - startY;

    const distance = Math.hypot(dx, dy);

    /*
       The arrow head is naturally pointing UP.
       atan2 gives the target direction.
    */
    const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;

    /* Head starts exactly at the bow launch point. */
    arrow.style.left = startX + "px";
    arrow.style.top = startY + "px";
    arrow.style.height = Math.max(distance, 40) + "px";
    arrow.style.transform =
        `translate(-50%,0) rotate(${angle}deg)`;
    arrow.style.opacity = "1";

    const duration = Math.max(420, Math.min(700, distance * 1.05));
    const startTime = performance.now();

    function animateArrow(now){

        const progress = Math.min(
            (now - startTime) / duration,
            1
        );

        const ease = 1 - Math.pow(1 - progress, 3);

        const currentX = startX + dx * ease;
        const currentY = startY + dy * ease;

        arrow.style.left = currentX + "px";
        arrow.style.top = currentY + "px";

        if(progress < 1){
            requestAnimationFrame(animateArrow);
            return;
        }

        /*
           FINAL POSITION:
           Arrow HEAD center is exactly at the clicked option center.
        */
        arrow.style.left = targetX + "px";
        arrow.style.top = targetY + "px";

        createHitEffect(targetX, targetY);

        setTimeout(() => {
            checkAnswer(option);
        }, 100);
    }

    requestAnimationFrame(animateArrow);
}

/* =========================================================
   HIT EFFECT
========================================================= */

function createHitEffect(
    x,
    y
){

    const board =
        document.querySelector(
            ".board"
        );


    const ring =
        document.createElement(
            "div"
        );


    ring.className =
        "arrow-hit";


    ring.style.left =
        x + "px";


    ring.style.top =
        y + "px";


    board.appendChild(
        ring
    );


    setTimeout(
        () => {

            ring.remove();

        },
        500
    );


    /*
       Small impact particles.
    */

    for(
        let i=0;
        i<10;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            x + "px";


        particle.style.top =
            y + "px";


        particle.style.background =
            i % 2 === 0
            ? "#fff700"
            : "#ffffff";


        particle.style.setProperty(
            "--x",
            (
                Math.random() *
                100 -
                50
            ) + "px"
        );


        particle.style.setProperty(
            "--y",
            (
                Math.random() *
                100 -
                50
            ) + "px"
        );


        board.appendChild(
            particle
        );


        setTimeout(
            () => {

                particle.remove();

            },
            750
        );

    }
}

            centerY + "px";

                )

            ) + "px"
        );

        piece.style.setProperty(
            "--cy",
            (
                Math.random() * 190 - 125
            ) + "px"
        );

        piece.style.setProperty(
            "--cr",
            (
                Math.random() * 720 - 360
            ) + "deg"
        );

        board.appendChild(piece);

        setTimeout(

/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(option){

    const selected =
        option.dataset.option;


    const correct =
        quizData[
            currentQuestion
        ].answer;


    /* =====================================================
       CORRECT
    ====================================================== */

    if(
        selected === correct
    ){

        completed[
            currentQuestion
        ] = true;

        /* The current question is now solved. */
        moving = false;

        score += 10;


        scoreEl.textContent =
            score;


        option.classList.add(
            "correct"
        );

        /*
           The question is solved.
           Disable every other option so the user cannot
           select another answer. Keep only the correct
           option highlighted.
        */
        optionsArea
            .querySelectorAll(".option")
            .forEach(otherOption => {

                otherOption.style.pointerEvents = "none";

                if(
                    otherOption.dataset.option !== correct
                ){
                    otherOption.classList.add("locked");
                }
            });


        showFeedback(
            "✓ CORRECT!",
            true
        );


        createParticles(
            option,
            true
        );

        /* Small confetti burst for every correct answer. */
        createSmallConfetti(option);


        correctSound();

        
        /* Update progress immediately, including Q5. */
        updateProgressUI();
/*
           CORRECT ANSWER:
           Keep the arrow exactly on the correct option.
        */
        arrow.style.opacity = "1";
        moving = false;

        /*
           CORRECT ANSWER:
           Q1 -> automatically load Q2
           Q2 -> automatically load Q3
           Q3 -> automatically load Q4
           Q4 -> automatically load Q5
           Q5 -> automatically open final popup
        */
        setTimeout(
            () => {
                goNext();
            },
            750
        );

    }


    /* =====================================================
       WRONG
    ====================================================== */

    else{

        option.classList.add(
            "wrong"
        );


        showFeedback(
            "✕ TRY AGAIN!",
            false
        );


        wrongSound();


        /*
           Break wrong option.
        */

        setTimeout(
            () => {

                breakOption(
                    option
                );

            },
            300
        );

    }
}


/* =========================================================
   BREAK OPTION
========================================================= */

function breakOption(option){

    const board =
        document.querySelector(
            ".board"
        );


    const boardRect =
        board.getBoundingClientRect();


    const rect =
        option.getBoundingClientRect();


    option.classList.add(
        "breaking"
    );


    const pieces = 20;


    const colors = [

        "#ff6b9f",
        "#e92768",
        "#ff9cbc",
        "#ffffff"

    ];


    for(
        let i=0;
        i<pieces;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "break-piece";


        piece.style.left =
            (
                rect.left -
                boardRect.left +
                Math.random() *
                rect.width
            ) + "px";


        piece.style.top =
            (
                rect.top -
                boardRect.top +
                Math.random() *
                rect.height
            ) + "px";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.setProperty(
            "--tx",
            (
                Math.random() *
                350 -
                175
            ) + "px"
        );


        piece.style.setProperty(
            "--ty",
            (
                Math.random() *
                280 -
                210
            ) + "px"
        );


        piece.style.setProperty(
            "--r",
            (
                Math.random() *
                720 -
                360
            ) + "deg"
        );


        board.appendChild(
            piece
        );


        setTimeout(
            () => {

                piece.remove();

            },
            900
        );

    }


    setTimeout(
        () => {

            option.style.opacity = '0';
            option.style.pointerEvents = 'none';

        },
        180
    );


    /*
       Return arrow to bow.
    */

    setTimeout(
        () => {

            returnArrow();

        },
        550
    );


    /*
       Reappear the option after disappearing.
    */

    setTimeout(
        () => {

            option.classList.remove('wrong', 'breaking');
            option.style.opacity = '';
            option.style.pointerEvents = '';

            option.classList.remove('drop-in');
            void option.offsetWidth;
            option.classList.add('drop-in');

        },
        1500
    );
}


/* =========================================================
   RETURN ARROW
========================================================= */

function returnArrow(){

    const board = document.querySelector(".board");
    const boardRect = board.getBoundingClientRect();
    const bowRect = bow.getBoundingClientRect();

    const startX = parseFloat(arrow.style.left) || 0;
    const startY = parseFloat(arrow.style.top) || 0;

    const targetX =
        bowRect.left - boardRect.left + bowRect.width / 2;

    const targetY =
        bowRect.top - boardRect.top + 4;

    const dx = targetX - startX;
    const dy = targetY - startY;

    const startAngle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    const targetAngle = 0;

    const duration = 500;
    const startTime = performance.now();

    function animate(now){

        const progress = Math.min(
            (now - startTime) / duration,
            1
        );

        const ease = 1 - Math.pow(1 - progress, 3);

        arrow.style.left =
            (startX + dx * ease) + "px";

        arrow.style.top =
            (startY + dy * ease) + "px";

        const angle =
            startAngle + (targetAngle - startAngle) * ease;

        arrow.style.transform =
            `translate(-50%,0) rotate(${angle}deg)`;

        if(progress < 1){
            requestAnimationFrame(animate);
            return;
        }

        resetArrow();
        moving = false;
    }

    requestAnimationFrame(animate);
}

/* =========================================================
   FEEDBACK
========================================================= */

function showFeedback(
    text,
    isCorrect
){

    feedback.textContent =
        text;


    feedback.className =
        "feedback " +
        (
            isCorrect
            ? "correct"
            : "wrong"
        );


    void feedback.offsetWidth;


    feedback.classList.add(
        "show"
    );
}

========================================================= */

        );


    const boardRect =
        board.getBoundingClientRect();


    const rect =

        ]
        :

            "#ff3d3d",
            "#ff7b7b",
            "#ffffff"
        ];


    for(
        let i=0;
        i<18;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            centerX + "px";


        particle.style.top =
            centerY + "px";


        particle.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        particle.style.setProperty(
            "--x",
            (
                Math.random() *
                220 -
                110
            ) + "px"
        );


        particle.style.setProperty(

            (
                Math.random() *

            ) + "px"

        );

/* =========================================================
   NEXT QUESTION
========================================================= */

function goNext(){

    if(
        !completed[currentQuestion]
    ){
        return;
    }

    if(
        currentQuestion >=
        quizData.length - 1
    ){
        showFinalResult();
        return;
    }

    currentQuestion++;
    loadQuestion();
}


/* =========================================================
   COMPLETED QUESTION
========================================================= */

function showCompletedQuestion(){

    const correct =
        quizData[
            currentQuestion
        ].answer;


    const options =
        optionsArea.querySelectorAll(
            ".option"
        );


    options.forEach(
        option => {

            option.style.pointerEvents = "none";

            if(
                option.dataset.option ===
                correct
            ){

                option.classList.remove("locked");

                option.classList.add(
                    "correct"
                );

            }else{

                option.classList.add("locked");

            }

        }
    );


    /* Manual NEXT button removed. */


    feedback.textContent =
        "✓ COMPLETED";


    feedback.className =
        "feedback correct";


    void feedback.offsetWidth;


    feedback.classList.add(
        "show"
    );
}


/* =========================================================
   SOUND BUTTON
========================================================= */

soundButton.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;


        soundButton.textContent =
            soundEnabled
            ? "🔊"
            : "🔇";


        if(soundEnabled){

            initAudio();

            clickSound();

        }

    }
);


/* =========================================================
   FULLSCREEN
========================================================= */

document
    .getElementById("fullscreen")
    .addEventListener(
        "click",
        async () => {

            try{

                if(
                    !document.fullscreenElement
                ){

                    await document
                        .documentElement
                        .requestFullscreen();

                }
                else{

                    await document
                        .exitFullscreen();

                }

            }
            catch(error){

                console.log(
                    "Fullscreen error:",
                    error
                );

            }

        }
    );


/* =========================================================
   KEYBOARD A B C D E
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(moving)
            return;


        const key =
            event.key.toUpperCase();


        if(
            [
                "A",
                "B",
                "C",
                "D",
                "E"
            ].includes(key)
        ){

            const option =
                document.querySelector(
                    `.option[data-option="${key}"]`
                );


            if(option){

                option.click();

            }

        }

    }
);

/* =========================================================
   FINAL RESULT
========================================================= */

function showFinalResult(){

    moving = false;

    questionNo.textContent = "✓";
    questionText.textContent = "🎉 QUIZ COMPLETED!";

    /* Remove the option content from the board.
       Bow and arrow remain part of the game, but are
       visually hidden while the final popup is open. */
    optionsArea.innerHTML = "";

    bow.style.display = "none";
    arrow.style.display = "none";

    nextButton.disabled = true;
    prevButton.disabled = true;

    document.getElementById("finalScore").textContent = score;

    const finalPopup =
        document.getElementById("finalPopup");

    finalPopup.classList.add("show");
    finalPopup.setAttribute("aria-hidden","false");

    /* Big confetti celebration for the final popup. */
    createFinalConfetti();

    correctSound();
}


/* =========================================================
   PLAY AGAIN
========================================================= */

document
    .getElementById("playAgainButton")
    .addEventListener("click", function(){

        const finalPopup =
            document.getElementById("finalPopup");

        finalPopup.classList.remove("show");
        finalPopup.setAttribute("aria-hidden","true");

        /* Reset quiz state */
        currentQuestion = 0;
        score = 0;
        moving = false;

        completed.fill(false);

        scoreEl.textContent = "0";

        /* Show bow and arrow again */
        bow.style.display = "";
        arrow.style.display = "";

        /* Remove old visual effects */
        document
            .querySelectorAll(
                ".particle,.arrow-hit,.feedback,.break-piece,.small-confetti"
            )
            .forEach(el => el.remove());

        const finalConfetti =
            document.getElementById("finalConfetti");

        if(finalConfetti){
            finalConfetti.innerHTML = "";
        }

        feedback.className = "feedback";
        feedback.textContent = "";

        resetArrow();

        updateProgressUI();
        loadQuestion();

        window.scrollTo(0,0);
    });


window.addEventListener("resize", () => {
    if(!moving){
        resetArrow();
    }
});

/* =========================================================
   START GAME
========================================================= */

loadQuestion();

</script>


<script>
/* =========================================================
   PROGRESS BUTTON - FINAL WORKING HANDLER
========================================================= */
(function(){

    function setupProgress(){

        const button =
            document.getElementById("progressButton");

        const popup =
            document.getElementById("progressPopup");

        const close =
            document.getElementById("progressClose");

        if(!button || !popup){
            return;
        }

        button.onclick = function(event){
            event.preventDefault();
            event.stopPropagation();

            if(typeof updateProgressUI === "function"){
                updateProgressUI();
            }

            popup.classList.add("show");
            popup.setAttribute("aria-hidden","false");
        };

        if(close){
            close.onclick = function(event){
                event.preventDefault();
                event.stopPropagation();

                popup.classList.remove("show");
                popup.setAttribute("aria-hidden","true");
            };
        }

        popup.onclick = function(event){
            if(event.target === popup){
                popup.classList.remove("show");
                popup.setAttribute("aria-hidden","true");
            }
        };
    }

    if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded",setupProgress);
    }else{
        setupProgress();
    }

})();
</script>
